<script id="nopera-public-project" type="application/json">{"format":"NOPERA_TEMP_PROJECT","formatVersion":3,"savedAt":"2026-10-31T10:36:09.236Z","manuscript":{"fullText":"Part I — The Ancient Age\n\nChapter 1 — The Age of Gods\n\nSection 1 — Prologue\n\nLong, long ago—before the world had taken the shape we know today.\n\n  There existed a primordial force known as Wol—the source of all existence.\n  From Wol, three supreme gods were born in the heavens.\n\n  One was the God of Creation, who brought all things into being.\n  Another was the God of Destruction, who brought an end to that which had been created.\n  And the third was the God of Harmony, who reconciled the two and maintained the balance of the world.\n\n  Through the endless cycle of creation, destruction, and the harmony between them, the three supreme gods shaped the foundations of the world.\n  From this ceaseless interplay, the many forces and concepts that govern existence gradually emerged, and with them came the gods who presided over each.\n  And in time, countless forms of life were brought into being, among them humankind.\n\n  Yet even the gods could not exist for eternity merely by virtue of their divinity.\n  Those who received no faith from the beings of the world would gradually lose their power and eventually fade from existence, while those who inspired deep devotion could preserve their strength.\n\n  Thus, what the gods sought from the inhabitants of the world was faith—pure and unwavering. At times, even the gods themselves would come into conflict over the devotion of those who worshipped them.\n\n  —The Continent of Susans.\n\n  A vast land in the material realm, where humankind and countless other forms of life had been brought into existence.\n  Yet this land had not existed since the beginning of time.\n  In an age long forgotten, the continent was created to imprison a god who held dominion over Time itself.\n\n  That god's name was—Suseons.\n\n  And the land that sealed away this god was none other than the Continent of Susans—the stage upon which the story we are about to tell would unfold.\n\nSection 2 — Alvardine\n\n  The heavenly realm, where the gods dwelled.\n\n  Two young deities had been summoned there.\n  The elder brother was Apollon Dice.\n  His younger sister was Altemisha Lua.\n  Together, they were the brother and sister gods who presided over light and fate.\n\n  Before them hung a white lace curtain, stretching from ceiling to floor. Beyond it were the three supreme gods who had existed since the beginning of the world—the gods of Creation, Destruction, and Harmony.\n\n  Yet their forms remained unseen.\n  Even among the inhabitants of the heavenly realm, few had ever laid eyes upon the three supreme gods. Apollon and Altemisha stood before the white curtain, waiting for a voice to emerge from beyond it.\n\n  At last, a gentle voice broke the silence.\n\n“I have brought so many things into existence.”\n  It was the voice of Alvardine, the God of Creation.\n“You two as well. And—Suseons, my child.”\n  Her voice fell silent for a moment.\n\n“But the power Suseons wielded was beyond anything we had imagined. He became consumed by that power, and in time, sought to claim all of the heavenly realm for himself.”\n\n  The white curtain remained perfectly still.\n\n“Even we could not escape the power of time.”\n  Apollon raised his eyes.\n  Beside him, Altemisha turned her head slightly.\n\n“Over many long years, Suseons had been using his power over time against us. Little by little… so slowly that even we ourselves failed to notice—perhaps it should be called the Curse of Time.”\n  Silence fell once more.\n\n“By the time we realized what was happening, it was already—”\n  Her words broke off.\n\n  At last, Alvardine's voice broke the silence.\n“Suseons seeks to cast us aside and become the ruler of the heavenly realm. But as we are now, we no longer possess the strength to stand against his power.”\n  Apollon and Altemisha remained silent, their eyes fixed upon the white curtain.\n\n“That is why I summoned you.”\n  It was then that something happened.\n  The white lace stirred ever so slightly, and a narrow opening appeared at its center.\n  Slowly, a hand emerged through the gap.\n\n  Apollon's gaze settled upon the hand.   \n  Altemisha, too, remained motionless.\n  Both deities knew that hand.\n  The hand of Alvardine, the God of Creation, as they had once seen it, had been fair, youthful, and full of life.\n\n  The mother of all things, who had brought everything into existence. Alvardine, the God of Creation, the very source of life itself.\n\n  But the hand now extended before them was thin and deeply wrinkled, like that of an elderly human woman who had lived through countless years.\n  And upon that hand rested a sword.\n  A pale blue light pulsed along its blade.\n\n  From beyond the white curtain came Alvardine's voice.\n\n“This sword holds what remains of my power.”\n  Apollon's gaze shifted from the aged hand to the sword.\n“Only the power of a god can stand against the power of a god. This sword shall wield that power in my stead.”\n\n  A brief silence followed.\n\n“With this sword, which shall take my place—”\nHer voice broke off once more.\n“Strike down Suseons.”\n\n  Apollon reached for the sword.\n  But his fingers hesitated.\n  His gaze shifted from the blade to the deeply wrinkled hand that held it—and at last, Apollon accepted the pale blue, glowing sword with both hands.\n\n  “Sar Alvardi…”\n\n  The whispered name echoed through the white chamber.\n  In the language of the gods—Alvardine's Proxy.\n\n  As the sword passed into Apollon's hands, the wrinkled hand slowly withdrew beyond the white lace, and the curtain closed once more.\n  Nothing more could be heard from beyond it.\n\nSection 3 — Suseons\n\n  The divine siblings who governed light and fate, Apollon Dice and Altemisha Lua, appeared once more before the three supreme gods. Their appearances bore the marks of the fierce battle they had just endured.\n  The change in Apollon was especially striking.   \n  Deep wrinkles now lined his once-youthful face, and the passage of time had left its mark upon his hair as well. The god who had appeared as a young man only moments before now looked like a man in middle age. Altemisha, standing beside him, showed no such dramatic change. It was clear that her brother had shielded her from the worst of it.\n  Even gods were not eternal.\n  Suseons's “Curse of Time” had indeed taken its toll on Apollon.\n\n“It seems you were unable to destroy Suseons.”\n  A deep voice echoed from beyond the white curtain.\n\n  Apollon did not answer.\n  In his hand, he held the sword that glowed with a pale blue light—Sar Alvardi.\n“With that sword, you should have been able to strike down my child.”\n  This time, it was Alvardine who spoke.\n\n  The siblings remained silent, their heads bowed.\n  After a long silence, Apollon finally spoke.\n“Suseons has left the heavenly realm and fled into the material realm.”\n“Then he must be pursued.”\n  The same deep voice answered without hesitation.\n\n“If we allow him to live, he will eventually gather worshippers among the inhabitants of the material realm and regain his power. Then he will repeat what he has done before.”\n  Another voice continued quietly.\n“And if he should find a suitable ‘vessel’ for himself in the material realm… he will become far more difficult to stop.”\n  Apollon said nothing, and Altemisha remained silent beside her brother.\n\n“Why did you not strike him down?”\n  The deep voice questioned him once more.\n  Apollon's hand moved ever so slightly.\n  A pale blue light coursed through Sar Alvardi in his grasp, and Apollon lowered his gaze to the sword.\n“This sword… was entrusted with the power of Mother Alvardine.”\n  With those words, Apollon fell silent.\n  No answer came from beyond the white curtain.\n“And yet—”\n  Apollon raised his head.\n“If we erase Suseons from existence, we may forever lose the means to break the ‘Curse of Time’.”\n\n　Silence.\n\n  Apollon's gaze turned toward the white lace, but the supreme gods gave no answer. Nor did the deeply wrinkled hand he had seen earlier appear again from beyond the curtain.\n\n“We will go to the material realm.”\n  It was Apollon who broke the silence.\n“We will catch up with Suseons before he can find a vessel, and seal him away within the material realm.”\n  Altemisha, standing beside him, quietly looked at her brother before turning to face the white curtain, just as Apollon had.\n“So that he may never wield that power again.”\n  For a while, no one spoke.\n\n  At last, a voice came from beyond the white curtain.\n“…Go.”\n  It was Alvardine's voice.\n\n＊\n\n  The material realm.\n  A world inhabited by humans and countless other forms of life. The faith of those who lived there was also a source of power for the gods.\n  Driven from the heavenly realm and stripped of his power, Suseons had sought refuge here to gather the faith of this world's inhabitants and reclaim the power he had lost.\n  And in this world, there was not yet a continent known as “Susans.”\n\n  A tiny black hole appeared in the clear blue sky.\n  At first, it was no more than a speck, but it slowly widened. Before long, smoke tinged with blue light began to seep from its depths, hissing—hiss, hiss.\n  Accompanied by a low rumble, the smoke poured forth without end, spreading until it began to engulf the once-clear blue sky.\n  The winds grew violent, the sea began to churn, and soon enormous waves crashed against one another.\n  As sky and sea raged, the black hole continued to expand.\n\n  Several days passed.\n  And at last, an enormous sphere emerged from the depths of the hole.\n  A sphere as black as darkness itself, its surface shrouded in a faint blue glow.\n  Suseons—the God of Time.\n\n  The battle in the heavenly realm had already robbed him of much of his power. And for gods to remain in the material realm, they had to find a suitable “vessel” within this world.\n  The black sphere, wreathed in blue light, drifted slowly through the raging sky—seeking a vessel of his own, so that he might regain his power through the faith of those who dwelled there.\n\n  But before long, the black hole behind him began to glow once more, and two lights burst forth.\n  Apollon Dice and Altemisha Lua—the divine siblings had caught up with Suseons before he could find a vessel of his own in this world.\n\n  Three lights clashed in the raging sky, and once more, a battle among the gods began.\n  Each time the powers of the three gods collided, the heavens trembled, the seas split apart, and blue flashes illuminated the world.\n  But Suseons no longer possessed the power he once had, and this battle did not last nearly as long as the desperate struggle that had unfolded in the heavenly realm.\n  The siblings pursued the fleeing Suseons and finally cornered him. At last, the blue light surrounding the black sphere faded away. All that remained was a sphere of utter darkness, stripped of its light.\n\n  Apollon and Altemisha forced the sphere down into the sea. The waters parted, and the seabed split open with a thunderous roar. Suseons sank into the depths of the vast fissure.　  \n  As the lights of the two gods converged above the fissure, the seabed began to rise, and enormous masses of rock closed over Suseons—thus, the God of Time was sealed away deep beneath the earth of the material realm.\n\n  When it was all over, the raging sea gradually returned to calm.\n  But something now stood where nothing had existed before.\n  In the midst of the vast ocean, an enormous continent had been born. A colossal seal created to prevent the God of Time, who lay dormant deep beneath the earth, from ever emerging into the world again.\n  In essence, the continent itself was the “Gate of Sealing.”\n\n＊\n\n  A long time passed.\n  In time, people would come to inhabit the continent, kingdoms would rise, and countless stories would unfold.\n  And eventually, the people came to name the continent after the god sealed deep beneath the earth—Suseons.\n  The continent of “Susans.” \n  And thus, the stage was set for this story.\n\n\nChapter 2 — The Age of Heroes\n\n【Characters in This Chapter】\n\nVilgandiria:\n　A long- lived man who dwells in the Crystal Forest. Possessing a wealth of knowledge and experience, his encounter with Sayvard sets his destiny on a profoundly different course.\n\n\nSayvard Kahn (the first king): \n　A human warrior who defeated the forces of El-Jesus, followers of the God of Time, that once ravaged the continent, and became the first to unite the continent.\n\n\nAlvard Sosha: \n　Sayvard 's daughter. A master swordswoman known as the Crimson Warrior.\n \n\n\n\n\n\n\n\nSection 1 — Vilgandiria\n\n　Thousands, perhaps tens of thousands, of years had passed since the gods fought to seal away Suseons, the God of Time. This story takes place roughly a thousand years before the present day.\n\n　At the heart of the continent lay a vast woodland known since ancient times as the Crystal Forest.\n　When the morning sunlight filtered through the trees, the forest shimmered as though countless crystals had been scattered among its branches. Yet the glittering objects were not crystals at all, but translucent fruits growing upon the trees.\n　Tinged with pale blue and green, the fruits caught the sunlight and reflected its gentle glow deep into the forest. Birds pecked at them, while small animals gathered those that had fallen to the ground… To those who lived in the forest, there was nothing rare or mysterious about the sight. It was simply part of everyday life.\n \n　The Crystal Forest was home to those known as the “Crystal Elves.”\n　Elves closely resembled humans in appearance, but they were a people who lived far longer than humankind. Rather than gathering in large settlements as humans did, they preferred to find their homes amid nature—in forests, mountains, and beside lakes—living quietly in harmony with the lands they called home.\n　Drawn by the allure of this extraordinary forest, elves of many different bloodlines and homelands had come from across the continent and beyond, gradually putting down roots here over countless years. In time, people came to refer to them collectively as the Crystal Elves, after the forest in which they lived.\n\n　Among these Crystal Elves, there was a man who had come to be affectionately known as “Lark, the Ageless Man.” He was walking through the forest.\n　Vilgandiria.\n　Long golden hair framed his face, revealing the tips of his slightly pointed ears. By his appearance alone, he could have been mistaken for a young man, yet he had already spent more than a hundred years in this forest, making him one of the longest-standing residents among the Crystal Elves. He himself could no longer remember his exact age. He had almost no memories of his childhood, nor did he know what blood flowed through his veins.\n　Here and there, however, strands of black were woven into his golden hair, and a faint trace of stubble sometimes appeared along his chin. He suspected that his ancestry included humans or other peoples besides elves, but it was not something that particularly interested him.\n　　Who was he, really?\n　　How many more years would he live?\n　Rather than dwell on such questions, he wanted nothing more than to live quietly in this forest. The sound of wind passing through the trees, the sight of crystal fruits gleaming in the morning sun, the voices of tiny creatures stirring after nightfall… As long as he could experience these simple wonders each day, he asked for nothing more.\n\n“Lark?”\n　A voice called out unexpectedly from behind him.\n　Turning around, he saw a man he had known for many years—a man who looked far older than Vilgandiria, though in truth, they should have been roughly the same age.\n“Are you coming tonight?”\n“…To what?”\n“You said you'd come to my house for dinner tonight. Have you forgotten?”\n　Vilgandiria remained silent for a while.\n“…I'm sorry, but I'll have to decline tonight.”\n“Tonight, too, you mean, Lark. You never seem to change on the outside, but you've changed quite a lot on the inside.”\n　Vilgandiria looked at his friend's face as the man spoke with a weary sigh. When had it happened? At some point, without his even noticing, this man had grown so old.\n“Come if you feel like it. Everyone wants to see you.”\nWith those parting words, his friend walked away.\n“Ah, I'm sorry I forgot our promise…”\n　Vilgandiria stood watching his friend's retreating figure for a while.\n\n　To live a long life was to encounter many people and experience many things. But it also meant having to say goodbye to so many of them. Vilgandiria, known as Lark—the Ageless Man—had already watched countless companions pass away. Even the elves of this forest, whose lives were far longer than those of humans, were no exception.\n　He would meet someone, spend time with them, grow close to them—and then, sooner or later, they would grow old while he remained unchanged, leaving him behind when they were gone. The more deeply he loved someone or something, the more unbearable the pain of parting became.\n　After enduring this sorrow time and again, Vilgandiria had gradually begun to distance himself from his companions, as though trying to escape the pain.\n\n　＊\n\n　One day, the peaceful life Vilgandiria had led in the Crystal Forest for more than a hundred years came to a sudden end at the hands of invaders.\n　As screams echoed through the forest, birds took flight all at once, and black smoke rose from beyond the trees.\n\n　The invaders of the Crystal Forest were followers of Suseons, the God of Time—the El-Jezas. Their ranks included members of many different races, though humans made up the majority. They had but one purpose: to resurrect the legendary God of Time, Suseons, who was said to be sealed away in this land, and obtain eternal life through his power over time.\n　Throughout the history of the continent of Susans, the El-Jezas had appeared time and again, threatening the peace of the land wherever they emerged.\n\n　It was this band of El-Jezas that had set its sights on the Crystal Forest.\n“Head west!”\n　Vilgandiria shouted to his companions.\n“Deeper into the forest! Don't come back here!”\n　Bow in hand, he ran alone in the opposite direction from his fleeing companions.\n　Having lived in the forest for so long, Vilgandiria knew little of what could truly be called “combat.” But he knew the forest better than anyone. He knew the paths taken by wild animals, the ground that would give way beneath a careless footstep, the hollows concealed by tangled vines, and which branches could bear a person's weight and which would snap with ease. To him, the forest itself was a weapon.\n　Invaders stumbled into traps he had laid. Arrows flew between the trees. He appeared and vanished, drawing his pursuers after him, only to lure them down another path—little by little, Vilgandiria led the invaders farther away from the heart of the forest.\n\n　But there were simply too many enemies.\n　For every one he brought down, two more appeared behind them, and beyond those two, he could hear yet more footsteps approaching.\n　Before long, he had exhausted both his traps and his arrows.\n　Vilgandiria discarded his bow and drew the sword at his waist with his wounded hand, but he was already struggling to catch his breath.\n　—So this is the end.\n　He was not afraid of death itself.\n　I've lived long enough already… Yet what troubled him more was the thought of these invaders advancing deeper into the forest after he had fallen. He tightened his grip on his sword once more.\n　\n　It was then that it happened.\n“Get down!”\n　A shout came in the unfamiliar tongue of humans.\n　Before Vilgandiria could even think about what the words meant, several figures rushed past him. At their head was a black-haired young man, whose sword knocked the weapon from the hands of an attacker closing in on Vilgandiria.\n“Are you all right?”\n　When Vilgandiria said nothing, the young man gave him a puzzled look.\n“…You don't understand me?”\n“No, I understand.”\n“Oh, good! We're not El-Jezas. We're on your side!”\n　Even in the midst of such danger, the young man grinned.\n“We can talk later. More are coming!”\n　The two stood back to back, raising their swords at the same moment.\n\n　This was the first time he had ever met this human. He did not even know his name, much less why he had come into the Crystal Forest… And yet, strangely enough, Vilgandiria felt no need to watch his back.\n\n　By the time the fighting was over, the first light of dawn had begun to filter through the forest.\n　The young man reached out his hand to Vilgandiria with an open, carefree smile, then pointed to himself.\n“My name is Sayvard. We were pursuing those bastards, and ended up coming all the way into this forest.”\n　He and his companions had pursued the El-Jezas, who had attacked the human lands, all the way to the outskirts of the Crystal Forest in their campaign to defeat them. By joining forces with these warriors, Vilgandiria had succeeded in driving the El-Jezas out of the forest. And this young human, who led the forces fighting against the El-Jezas, was none other than Sayvard Kahn himself—the man who, some twenty years later, would establish the first human kingdom on the continent of Susans and become its first king.\n\n　The young man then pointed at Vilgandiria.\n“What's your name?”\n“…Vilgandiria. Everyone in this forest calls me Lark.”\n“Vilgan… Lark…”\n　It seemed that the young human had trouble making out the words of the elves.\n　Vilgandiria frowned, but the young man merely laughed again. Judging by appearances, there seemed to be little difference in age between them. Yet considering the lifespan of humans, this young man was far, far younger than he was… To Vilgandiria, he should have been little more than a child. But perhaps, after spending so many years distancing himself from his companions and living alone, he had been starving for the company of others. As he spent time with Sayvard and his companions, Vilgandiria felt something within him gradually being filled.\n　He also felt an indescribable curiosity stirring within him as he encountered humans for the first time—a people whose blood might, perhaps, flow through his own veins. To him, “time” seemed almost limitless… Yet these humans lived and acted with the awareness that this precious resource was finite. Having spent his life in a world where time passed so slowly, Vilgandiria found their way of living remarkably fresh and fascinating.\n\n　Vilgandiria, who had not set foot outside the Crystal Forest for a hundred years, gradually found himself traveling alongside Sayvard.\n　At first, he had intended to stay only until the El-Jezas had been driven from the lands surrounding the Crystal Forest. But one place led to another… one battle to the next… and before he knew it, the forest he had not left in over a century lay far behind him.\n　By traveling with Sayvard, he came to know the world beyond the forest for the first time. It was a world far more exciting and full of change than the Crystal Forest, where long-lived elves dwelled and time seemed to stretch on forever. Vilgandiria felt as though the time that had stood still within him had quietly begun to move again.\n\n　＊\n\n　Sayvard, who led his fellow humans in pursuit of a peaceful world, had also come to rely on Vilgandiria's talents, vast experience, and　knowledge. The golden-haired young man he had encountered in the forest might even have been younger than himself, yet he knew so much about the continent. He knew its lands, its plants, and its animals. He knew ancient legends unfamiliar to humans, and at times served as a bridge between Sayvard's people and those who spoke languages other than their own. His skill with both sword and bow rivaled that of the finest warriors Sayvard had ever known. At first, Sayvard had struggled to understand the elven language Vilgandiria spoke, but it was not long before the young man began speaking the human tongue with ease and fluency.\n　Before long, Vilgandiria was always at Sayvard's side, sometimes fighting alongside him with sword in hand, and sometimes spending entire nights exchanging ideas about how to bring peace to the world. Vilgandiria had no desire to stand in the spotlight, nor did he have the slightest wish to leave his name in history. Yet everyone who had fought alongside Sayvard knew that Vilgandiria was the foremost hero behind the founding of Sayvard's kingdom.\n　\n　And after countless battles—most of them fought against the El-Jezas who plagued lands across the continent—Sayvard Kahn finally established the first human kingdom on the continent of Susans. Sayvard had been twenty-six when he first met Vilgandiria. Now, after twenty-two years of fighting, he was already forty-eight.\n　This was Year 0 of the Susans Continental Era, approximately a thousand years before the present day.\n\n　In the ages that followed, people would remember Sayvard Kahn as the hero who founded the kingdom, the first king. Yet no one now remembers that another hero had always stood beside him.\n　Vilgandiria.\n　And yet, the time that had stood still for him throughout his long years in the Crystal Forest had indeed begun to move again.\n\nSUSANS Continental Era — Year −22 \n\n\n\nSection 2 — Sayvard\n\n　Year 0 of the Susans Continental Era—Sayvard Kahn, the first king of the human kingdom of Actmais, drove out the El-Jezas, followers of Suseons, the God of Time, whose influence had spread across the continent, and established the first human kingdom on the continent.\n\n　Nearly twenty years had passed since Sayvard first encountered Vilgandiria, the Ageless Man, in the Crystal Forest.\n　Most of their battles had been against the El-Jezas, but defeating them alone was not enough to build a human kingdom. There were monsters lurking throughout the land to be vanquished, disputes between different races to be mediated, and conflicts among humans themselves to be settled—there was no end to the work that needed to be done.\n　Vilgandiria had remained unchanged since the day they first met in the forest, always watching Sayvard's back and sharing wisdom far beyond anything Sayvard himself possessed. In particular, the negotiations with the king of the dragon race dwelling in the southern mountains would never have made any progress without Vilgandiria. Above all, he had never shown the slightest ambition or desire for personal gain. He had simply stood beside Sayvard, supporting him in everything he sought to accomplish.\n　Without him, I could never have achieved any of this.\n　Vilgandiria—over time, the humans had come to call him “Bilgan Durak.” The name had originated when Sayvard, shortly after their first meeting, had struggled to make out his words in the elven tongue. Vilgandiria had never bothered to correct the misunderstanding. Instead, he had gradually grown fond of the name Sayvard had given him, embracing it as his own.\n　And even after the human kingdom was established, Bilgan did not return to the Crystal Forest.\n　Though the kingdom had been founded, the El-Jezas still remained scattered throughout the land, and true peace had yet to come. Sayvard wanted Bilgan to stay in the kingdom as a trusted companion. But more than that—after twenty years together, he had come to regard Bilgan as family. He simply did not want to part with him.\n　Sayvard was already forty-eight years old, and a daughter had been born to him about three years before the founding of the kingdom. Yet throughout his busy days, it was Bilgan, rather than his own family, who had spent the most time by his side.\n\n　＊\n\n　When Sayvard was a few years past fifty, he hesitantly asked a question.\n“Bilgan… how much longer will you stay here?”\n　More than twenty-five years had passed since they first met in the Crystal Forest. Yet Bilgan looked almost exactly as he had back then. After all, even the long-lived elves had called him the “Ageless Man,” so perhaps it was only natural. Still, seeing it with his own eyes was undeniably strange.\n　By contrast, fine wrinkles had begun to form around Sayvard's eyes, and strands of gray were appearing in his hair.\n(Well, well… It seems I've somehow grown old before him…)\n　Of course, Sayvard had never known Vilgandiria's true age in the first place, so no matter how much time passed, their actual ages could never have reversed. Yet judging by appearances alone, he could hardly help feeling that way. Wondering how he must look to Bilgan now, Sayvard sighed inwardly.\n“Are you suggesting that perhaps it's time I returned to the forest?”\n　Perhaps sensing the unease behind Sayvard's unusually solemn question, his young-looking friend replied with a teasing smile.\n“It's true that we've all but wiped out the El-Jezas. But the embers of conflict still smolder throughout the land. I still need your strength, and I'd be in trouble if you left.”\n　Sayvard answered with a serious expression, giving Vilgan the very words he had hoped to hear. Vilgan smiled.\n“As long as you want me here, I intend to stay.”\n　At those words, Sayvard's expression finally brightened.\n“Then I want you to stay forever. Fortunately—”\n　Sayvard suddenly turned his head. Nearby, his young daughter lay sleeping peacefully.\n“Fortunately—my daughter has grown quite fond of you, too.”\n　Vilgandiria, too, turned his gentle silver eyes toward the sleeping child.\n　The man who had once spent his days in solitude in the Crystal Forest was no longer there.\n\n　＊\n\n　As he had promised Sayvard, Vilgandiria continued to support him even after the founding of the kingdom. At times, he led armies alongside Sayvard on campaigns to quell conflicts throughout the land.\n　As the fighting gradually subsided, his responsibilities began to shift toward raising Sayvard's daughter, Alvard Sosha, who had been named after Alvardine, the Creator Goddess. Swordsmanship, archery, horsemanship, geography, history, languages, astronomy… Vilgan taught her everything he knew.\n　And when Alvard grew old enough to wield a sword with confidence, Vilgan began taking her onto the battlefield, sometimes even entrusting her with command of the troops in his place. Having inherited her father's gift for warfare, she showed extraordinary talent from an early age, both in combat and in leading others.\n\n　A little more than ten years had passed since the founding of the kingdom, and Sayvard was approaching sixty. He had fewer opportunities to wield his sword himself, spending more and more of his time governing the kingdom. In his place, it was mainly Bilgan and the now-grown Alvard who took to the battlefield. Though still only in her mid-teens, Alvard had already distinguished herself in battle, and Sayvard sometimes saw something of his younger self in her.\n　Clad in crimson armor, her beautiful black hair flowing behind her as she fought with fearless courage, Alvard had gradually come to be revered by the soldiers as a goddess of victory. And the back that Vilgan watched over had also changed with time—no longer Sayvard's, but that of Alvard, the Crimson Warrior.\n　\n　＊\n\n　More than thirty years had passed since Sayvard first met Bilgan, and the companions who had fought alongside them in the Crystal Forest were passing away, one by one. Within the kingdom, too, there were now more and more people who had no idea how great a role Vilgan had played in its founding.\n　Some of Sayvard's retainers had even begun to regard this man, who showed no signs of aging despite the passing years and excelled in both combat and knowledge, as a potential threat. A few went so far as to advise Sayvard to distance him from the kingdom. But Sayvard refused to listen to any such counsel.\n　Bilgan himself, meanwhile, seemed to have noticed the changing attitudes around him. He had grown even more reluctant to appear in public, and within the royal palace, he increasingly took care to conduct himself discreetly and avoid drawing attention.\n\n　One day, Sayvard summoned Bilgan to his private chambers, taking care to avoid the attention of others. As they faced each other alone for the first time in quite a while, Sayvard felt that the brightness he had once known in his friend's expression had faded.\n(Perhaps life here has become too confining for him… If things continue like this, he may eventually leave my side.)\n　Sayvard searched for the right words for a while before speaking quietly.\n“This continent is vast. There's a limit to how much I can protect on my own, ruling it all as a single kingdom. So I've been thinking—what if we eventually divided it into several kingdoms, each governed by its own king?”\n　He continued, watching Bilgan's expression for any sign of a reaction.\n“And I'd like you to rule one of those kingdoms.”\n　Bilgan did not answer the unexpected proposal immediately.\n“I have no desire for such a thing… I thought you, of all people, would understand that.”\n　At last, Bilgan looked Sayvard straight in the face. Sayvard felt as though his friend's gaze had settled on the deep wrinkles etched into his face and the hair that had turned more than half gray. When they had first met, they had been almost the same height, but now Sayvard stood slightly shorter than his friend.\n\"You've grown old… Sayvard.\"\n\"More than thirty years have passed since then… It can't be helped. For a human like me, thirty years is a very long time.\"\n　Sayvard turned his face away, as though trying to escape Bilgan's gaze.\n\"I have to start making decisions with the end of my own life in mind. You're the only one I can trust to carry on after I'm gone.\"\n　Bilgan remained silent.\n\"The children are still far too inexperienced. You're the only one who—\"\n\"I think dividing the kingdom is a good idea.\"\n　Bilgan interrupted him.\n\"You should become the king of kings, ruling over the other kingdoms from here. But—I cannot be the king of a human kingdom.\"\n　After a brief pause, he continued.\n\"Besides, I've taught Al… Alvard everything I know. In time, I'm certain she'll become someone worthy of bearing the responsibility for this kingdom.\"\n\"Then will you stand by Alvard in my place?\"\n　Sayvard looked at Bilgan with pleading eyes. The voice that had once rung out across battlefields was now slightly hoarse.\n\"Alvard…?\"\n　Sayvard nodded.\n\"Ever since my daughter was born, you've always been there for her… If you stay by her side, I'm sure she'll one day become a queen worthy of leading this kingdom… And I… someday…\"\n　For just an instant, Sayvard thought he saw Bilgan's expression twist with pain as his friend looked at him.\n　Bilgan said nothing more.\n　And without another word, he left the room.\n\n　And the fear that had haunted Sayvard finally became reality.\n　Not long afterward, Bilgan Durak vanished from Sayvard's kingdom. Without a word, without leaving anything behind.\n　Year 17 of the SUSANS Continental Era—seventeen years after Sayvard founded his kingdom. Sayvard was sixty-five years old, and Alvard had turned twenty.\n\n　＊\n \n　Before the aging Emperor Sayvard appeared a man and a woman, both enveloped in radiant light.\n　Sayvard knew them. He had met them once before, in his younger days—long before he had encountered Vilgandiria in the Crystal Forest.\n　For several years now, reports from across the land had told Sayvard that the followers of El-Jezas were once again growing in strength.\n\"Suseons has found a vessel through which he can take physical form in this world. If he descends into this world, you who dwell in the Material Plane—the realm governed by time—will stand no chance against him.\"\n　It was the young woman who spoke first. The light surrounding her obscured her face, but Sayvard remembered her voice.\n　Altemisha Lua—the goddess of light and destiny.\n\"Using a man you know well, Bilgan Durak, as his vessel…\"\n　This time, it was the man who spoke. Sayvard recognized his voice as well. Apollon Dice—a god of light and destiny, just like Altemisha.\n　Bilgan Durak.\n　The moment he heard that name, Sayvard felt his consciousness begin to slip away from sheer shock.\n　For decades—through nearly his entire life—he had fought alongside that trusted friend against the followers of El-Jezas. Why, after all this time, would Bilgan be involved with the very enemy they had fought together? And what could it possibly mean that he was to become Suseons's vessel?\n　He could make no sense of any of it.\n\"To stop him now that he has taken Suseons's will into his body and seeks to wield the power of time, you have grown somewhat too old. We shall borrow the body of your child and use our divine power to seal Suseons away.\"\n\"My child…?\"\n　Even as he repeated the question, Sayvard knew whom they meant by his \"child.\" And yet—he could not accept it.\n　Apollon Dice nodded slowly.\n\"Your daughter, who bears the name of Alvardine, the Mother of All.\"\n　The aging Emperor Sayvard's face darkened with anguish.\n\"That burden is far too cruel for her… She holds Bilgan Durak dear. As a father, as a teacher… and as a man.\"\n　The thought of those two—the beloved friend who had supported him through most of his life, and the daughter who loved that friend—being forced to fight each other to the death was almost more than Sayvard could bear.\n　\n　The goddess spoke gently to the troubled Sayvard.\n\"She will be all right. She will fulfill her destiny.\"\n\"Now, give your daughter Sar Alvardi, the divine sword bestowed upon you by Alvardine long ago to drive back the followers of El-Jezas. A body imbued with the power of a god can only be cut by a divine blade.\"\n　Apollon Dice turned his gaze toward the throne.\n　Behind it, a sword hung on display, still resting in its sheath. That sword had accompanied Sayvard across countless battlefields, yet it had not been drawn for many years.\n　At that moment, the sword drew itself from its sheath.\n　Sayvard's eyes widened. The blade of the divine sword Sar Alvardi was glowing with a pale blue light. Even Sayvard, who had wielded the sword for so many years, had never seen it shine like this before.\n　Apollon Dice made a slight beckoning gesture with his hand.\n　The divine sword, glowing pale blue, flew through the air and spun toward Sayvard before plunging deep into the floor, as though separating the two gods from the aging king.\n\n　\"The blood pact you once made with Alvardine will be passed down to your daughter as well. Entrust her with that sword, and seal Suseons away. Before he fully descends into this world.\"\n\n　Sayvard gazed at Sar Alvardi, embedded in the floor before him. The sword that the gods had entrusted to him in his youth must now be passed on to his daughter.\n　The pale blue light quietly illuminated the aging Sayvard's face.\n\n\nSUSANS Continental Era Year 17\n\n\n\n\n第三節　アルヴァード\n \n　大陸暦１７年。\n　アルヴァードは、自室に閉じこもったまま、もう何日も姿を見せていなかった。\nある日、ビルガン・デュラクが突然、彼女の前から姿を消してしまったのだ。\n　ビルガンは、アルヴァードが生まれたときから、ずっとそばにいた。幼い頃に母を亡くし、英雄王として多忙な父とも過ごす時間が限られていた彼女にとって、ビルガンは誰よりも身近な存在であり、自分を育て、導いてくれた師でもあった。\n\n","pages":[{"id":"page-root","text":"Part I — The Ancient Age\n\n"},{"id":"page-toc-2","text":"Chapter 1 — The Age of Gods\n\nSection 1 — Prologue\n\nLong, long ago—before the world had taken the shape we know today.\n\n  There existed a primordial force known as Wol—the source of all existence.\n  From Wol, three supreme gods were born in the heavens.\n\n  One was the God of Creation, who brought all things into being.\n  Another was the God of Destruction, who brought an end to that which had been created.\n  And the third was the God of Harmony, who reconciled the two and maintained the balance of the world.\n\n  Through the endless cycle of creation, destruction, and the harmony between them, the three supreme gods shaped the foundations of the world.\n  From this ceaseless interplay, the many forces and concepts that govern existence gradually emerged, and with them came the gods who presided over each.\n  And in time, countless forms of life were brought into being, among them humankind.\n\n  Yet even the gods could not exist for eternity merely by virtue of their divinity.\n  Those who received no faith from the beings of the world would gradually lose their power and eventually fade from existence, while those who inspired deep devotion could preserve their strength.\n\n  Thus, what the gods sought from the inhabitants of the world was faith—pure and unwavering. At times, even the gods themselves would come into conflict over the devotion of those who worshipped them.\n\n  —The Continent of Susans.\n\n  A vast land in the material realm, where humankind and countless other forms of life had been brought into existence.\n  Yet this land had not existed since the beginning of time.\n  In an age long forgotten, the continent was created to imprison a god who held dominion over Time itself.\n\n  That god's name was—Suseons.\n\n  And the land that sealed away this god was none other than the Continent of Susans—the stage upon which the story we are about to tell would unfold.\n\n"},{"id":"page-toc-4","text":"Section 2 — Alvardine\n\n  The heavenly realm, where the gods dwelled.\n\n  Two young deities had been summoned there.\n  The elder brother was Apollon Dice.\n  His younger sister was Altemisha Lua.\n  Together, they were the brother and sister gods who presided over light and fate.\n\n  Before them hung a white lace curtain, stretching from ceiling to floor. Beyond it were the three supreme gods who had existed since the beginning of the world—the gods of Creation, Destruction, and Harmony.\n\n  Yet their forms remained unseen.\n  Even among the inhabitants of the heavenly realm, few had ever laid eyes upon the three supreme gods. Apollon and Altemisha stood before the white curtain, waiting for a voice to emerge from beyond it.\n\n  At last, a gentle voice broke the silence.\n\n“I have brought so many things into existence.”\n  It was the voice of Alvardine, the God of Creation.\n“You two as well. And—Suseons, my child.”\n  Her voice fell silent for a moment.\n\n“But the power Suseons wielded was beyond anything we had imagined. He became consumed by that power, and in time, sought to claim all of the heavenly realm for himself.”\n\n  The white curtain remained perfectly still.\n\n“Even we could not escape the power of time.”\n  Apollon raised his eyes.\n  Beside him, Altemisha turned her head slightly.\n\n“Over many long years, Suseons had been using his power over time against us. Little by little… so slowly that even we ourselves failed to notice—perhaps it should be called the Curse of Time.”\n  Silence fell once more.\n\n“By the time we realized what was happening, it was already—”\n  Her words broke off.\n\n  At last, Alvardine's voice broke the silence.\n“Suseons seeks to cast us aside and become the ruler of the heavenly realm. But as we are now, we no longer possess the strength to stand against his power.”\n  Apollon and Altemisha remained silent, their eyes fixed upon the white curtain.\n\n“That is why I summoned you.”\n  It was then that something happened.\n  The white lace stirred ever so slightly, and a narrow opening appeared at its center.\n  Slowly, a hand emerged through the gap.\n\n  Apollon's gaze settled upon the hand.   \n  Altemisha, too, remained motionless.\n  Both deities knew that hand.\n  The hand of Alvardine, the God of Creation, as they had once seen it, had been fair, youthful, and full of life.\n\n  The mother of all things, who had brought everything into existence. Alvardine, the God of Creation, the very source of life itself.\n\n  But the hand now extended before them was thin and deeply wrinkled, like that of an elderly human woman who had lived through countless years.\n  And upon that hand rested a sword.\n  A pale blue light pulsed along its blade.\n\n  From beyond the white curtain came Alvardine's voice.\n\n“This sword holds what remains of my power.”\n  Apollon's gaze shifted from the aged hand to the sword.\n“Only the power of a god can stand against the power of a god. This sword shall wield that power in my stead.”\n\n  A brief silence followed.\n\n“With this sword, which shall take my place—”\nHer voice broke off once more.\n“Strike down Suseons.”\n\n  Apollon reached for the sword.\n  But his fingers hesitated.\n  His gaze shifted from the blade to the deeply wrinkled hand that held it—and at last, Apollon accepted the pale blue, glowing sword with both hands.\n\n  “Sar Alvardi…”\n\n  The whispered name echoed through the white chamber.\n  In the language of the gods—Alvardine's Proxy.\n\n  As the sword passed into Apollon's hands, the wrinkled hand slowly withdrew beyond the white lace, and the curtain closed once more.\n  Nothing more could be heard from beyond it.\n\n"},{"id":"page-toc-5","text":"Section 3 — Suseons\n\n  The divine siblings who governed light and fate, Apollon Dice and Altemisha Lua, appeared once more before the three supreme gods. Their appearances bore the marks of the fierce battle they had just endured.\n  The change in Apollon was especially striking.   \n  Deep wrinkles now lined his once-youthful face, and the passage of time had left its mark upon his hair as well. The god who had appeared as a young man only moments before now looked like a man in middle age. Altemisha, standing beside him, showed no such dramatic change. It was clear that her brother had shielded her from the worst of it.\n  Even gods were not eternal.\n  Suseons's “Curse of Time” had indeed taken its toll on Apollon.\n\n“It seems you were unable to destroy Suseons.”\n  A deep voice echoed from beyond the white curtain.\n\n  Apollon did not answer.\n  In his hand, he held the sword that glowed with a pale blue light—Sar Alvardi.\n“With that sword, you should have been able to strike down my child.”\n  This time, it was Alvardine who spoke.\n\n  The siblings remained silent, their heads bowed.\n  After a long silence, Apollon finally spoke.\n“Suseons has left the heavenly realm and fled into the material realm.”\n“Then he must be pursued.”\n  The same deep voice answered without hesitation.\n\n“If we allow him to live, he will eventually gather worshippers among the inhabitants of the material realm and regain his power. Then he will repeat what he has done before.”\n  Another voice continued quietly.\n“And if he should find a suitable ‘vessel’ for himself in the material realm… he will become far more difficult to stop.”\n  Apollon said nothing, and Altemisha remained silent beside her brother.\n\n“Why did you not strike him down?”\n  The deep voice questioned him once more.\n  Apollon's hand moved ever so slightly.\n  A pale blue light coursed through Sar Alvardi in his grasp, and Apollon lowered his gaze to the sword.\n“This sword… was entrusted with the power of Mother Alvardine.”\n  With those words, Apollon fell silent.\n  No answer came from beyond the white curtain.\n“And yet—”\n  Apollon raised his head.\n“If we erase Suseons from existence, we may forever lose the means to break the ‘Curse of Time’.”\n\n　Silence.\n\n  Apollon's gaze turned toward the white lace, but the supreme gods gave no answer. Nor did the deeply wrinkled hand he had seen earlier appear again from beyond the curtain.\n\n“We will go to the material realm.”\n  It was Apollon who broke the silence.\n“We will catch up with Suseons before he can find a vessel, and seal him away within the material realm.”\n  Altemisha, standing beside him, quietly looked at her brother before turning to face the white curtain, just as Apollon had.\n“So that he may never wield that power again.”\n  For a while, no one spoke.\n\n  At last, a voice came from beyond the white curtain.\n“…Go.”\n  It was Alvardine's voice.\n\n＊\n\n  The material realm.\n  A world inhabited by humans and countless other forms of life. The faith of those who lived there was also a source of power for the gods.\n  Driven from the heavenly realm and stripped of his power, Suseons had sought refuge here to gather the faith of this world's inhabitants and reclaim the power he had lost.\n  And in this world, there was not yet a continent known as “Susans.”\n\n  A tiny black hole appeared in the clear blue sky.\n  At first, it was no more than a speck, but it slowly widened. Before long, smoke tinged with blue light began to seep from its depths, hissing—hiss, hiss.\n  Accompanied by a low rumble, the smoke poured forth without end, spreading until it began to engulf the once-clear blue sky.\n  The winds grew violent, the sea began to churn, and soon enormous waves crashed against one another.\n  As sky and sea raged, the black hole continued to expand.\n\n  Several days passed.\n  And at last, an enormous sphere emerged from the depths of the hole.\n  A sphere as black as darkness itself, its surface shrouded in a faint blue glow.\n  Suseons—the God of Time.\n\n  The battle in the heavenly realm had already robbed him of much of his power. And for gods to remain in the material realm, they had to find a suitable “vessel” within this world.\n  The black sphere, wreathed in blue light, drifted slowly through the raging sky—seeking a vessel of his own, so that he might regain his power through the faith of those who dwelled there.\n\n  But before long, the black hole behind him began to glow once more, and two lights burst forth.\n  Apollon Dice and Altemisha Lua—the divine siblings had caught up with Suseons before he could find a vessel of his own in this world.\n\n  Three lights clashed in the raging sky, and once more, a battle among the gods began.\n  Each time the powers of the three gods collided, the heavens trembled, the seas split apart, and blue flashes illuminated the world.\n  But Suseons no longer possessed the power he once had, and this battle did not last nearly as long as the desperate struggle that had unfolded in the heavenly realm.\n  The siblings pursued the fleeing Suseons and finally cornered him. At last, the blue light surrounding the black sphere faded away. All that remained was a sphere of utter darkness, stripped of its light.\n\n  Apollon and Altemisha forced the sphere down into the sea. The waters parted, and the seabed split open with a thunderous roar. Suseons sank into the depths of the vast fissure.　  \n  As the lights of the two gods converged above the fissure, the seabed began to rise, and enormous masses of rock closed over Suseons—thus, the God of Time was sealed away deep beneath the earth of the material realm.\n\n  When it was all over, the raging sea gradually returned to calm.\n  But something now stood where nothing had existed before.\n  In the midst of the vast ocean, an enormous continent had been born. A colossal seal created to prevent the God of Time, who lay dormant deep beneath the earth, from ever emerging into the world again.\n  In essence, the continent itself was the “Gate of Sealing.”\n\n＊\n\n  A long time passed.\n  In time, people would come to inhabit the continent, kingdoms would rise, and countless stories would unfold.\n  And eventually, the people came to name the continent after the god sealed deep beneath the earth—Suseons.\n  The continent of “Susans.” \n  And thus, the stage was set for this story.\n\n\n"},{"id":"page-toc-7","text":"Chapter 2 — The Age of Heroes\n\n【Characters in This Chapter】\n\nVilgandiria:\n　A long- lived man who dwells in the Crystal Forest. Possessing a wealth of knowledge and experience, his encounter with Sayvard sets his destiny on a profoundly different course.\n\n\nSayvard Kahn (the first king): \n　A human warrior who defeated the forces of El-Jesus, followers of the God of Time, that once ravaged the continent, and became the first to unite the continent.\n\n\nAlvard Sosha: \n　Sayvard 's daughter. A master swordswoman known as the Crimson Warrior.\n \n\n\n\n\n\n\n\n"},{"id":"page-toc-8","text":"Section 1 — Vilgandiria\n\n　Thousands, perhaps tens of thousands, of years had passed since the gods fought to seal away Suseons, the God of Time. This story takes place roughly a thousand years before the present day.\n\n　At the heart of the continent lay a vast woodland known since ancient times as the Crystal Forest.\n　When the morning sunlight filtered through the trees, the forest shimmered as though countless crystals had been scattered among its branches. Yet the glittering objects were not crystals at all, but translucent fruits growing upon the trees.\n　Tinged with pale blue and green, the fruits caught the sunlight and reflected its gentle glow deep into the forest. Birds pecked at them, while small animals gathered those that had fallen to the ground… To those who lived in the forest, there was nothing rare or mysterious about the sight. It was simply part of everyday life.\n \n　The Crystal Forest was home to those known as the “Crystal Elves.”\n　Elves closely resembled humans in appearance, but they were a people who lived far longer than humankind. Rather than gathering in large settlements as humans did, they preferred to find their homes amid nature—in forests, mountains, and beside lakes—living quietly in harmony with the lands they called home.\n　Drawn by the allure of this extraordinary forest, elves of many different bloodlines and homelands had come from across the continent and beyond, gradually putting down roots here over countless years. In time, people came to refer to them collectively as the Crystal Elves, after the forest in which they lived.\n\n　Among these Crystal Elves, there was a man who had come to be affectionately known as “Lark, the Ageless Man.” He was walking through the forest.\n　Vilgandiria.\n　Long golden hair framed his face, revealing the tips of his slightly pointed ears. By his appearance alone, he could have been mistaken for a young man, yet he had already spent more than a hundred years in this forest, making him one of the longest-standing residents among the Crystal Elves. He himself could no longer remember his exact age. He had almost no memories of his childhood, nor did he know what blood flowed through his veins.\n　Here and there, however, strands of black were woven into his golden hair, and a faint trace of stubble sometimes appeared along his chin. He suspected that his ancestry included humans or other peoples besides elves, but it was not something that particularly interested him.\n　　Who was he, really?\n　　How many more years would he live?\n　Rather than dwell on such questions, he wanted nothing more than to live quietly in this forest. The sound of wind passing through the trees, the sight of crystal fruits gleaming in the morning sun, the voices of tiny creatures stirring after nightfall… As long as he could experience these simple wonders each day, he asked for nothing more.\n\n“Lark?”\n　A voice called out unexpectedly from behind him.\n　Turning around, he saw a man he had known for many years—a man who looked far older than Vilgandiria, though in truth, they should have been roughly the same age.\n“Are you coming tonight?”\n“…To what?”\n“You said you'd come to my house for dinner tonight. Have you forgotten?”\n　Vilgandiria remained silent for a while.\n“…I'm sorry, but I'll have to decline tonight.”\n“Tonight, too, you mean, Lark. You never seem to change on the outside, but you've changed quite a lot on the inside.”\n　Vilgandiria looked at his friend's face as the man spoke with a weary sigh. When had it happened? At some point, without his even noticing, this man had grown so old.\n“Come if you feel like it. Everyone wants to see you.”\nWith those parting words, his friend walked away.\n“Ah, I'm sorry I forgot our promise…”\n　Vilgandiria stood watching his friend's retreating figure for a while.\n\n　To live a long life was to encounter many people and experience many things. But it also meant having to say goodbye to so many of them. Vilgandiria, known as Lark—the Ageless Man—had already watched countless companions pass away. Even the elves of this forest, whose lives were far longer than those of humans, were no exception.\n　He would meet someone, spend time with them, grow close to them—and then, sooner or later, they would grow old while he remained unchanged, leaving him behind when they were gone. The more deeply he loved someone or something, the more unbearable the pain of parting became.\n　After enduring this sorrow time and again, Vilgandiria had gradually begun to distance himself from his companions, as though trying to escape the pain.\n\n　＊\n\n　One day, the peaceful life Vilgandiria had led in the Crystal Forest for more than a hundred years came to a sudden end at the hands of invaders.\n　As screams echoed through the forest, birds took flight all at once, and black smoke rose from beyond the trees.\n\n　The invaders of the Crystal Forest were followers of Suseons, the God of Time—the El-Jezas. Their ranks included members of many different races, though humans made up the majority. They had but one purpose: to resurrect the legendary God of Time, Suseons, who was said to be sealed away in this land, and obtain eternal life through his power over time.\n　Throughout the history of the continent of Susans, the El-Jezas had appeared time and again, threatening the peace of the land wherever they emerged.\n\n　It was this band of El-Jezas that had set its sights on the Crystal Forest.\n“Head west!”\n　Vilgandiria shouted to his companions.\n“Deeper into the forest! Don't come back here!”\n　Bow in hand, he ran alone in the opposite direction from his fleeing companions.\n　Having lived in the forest for so long, Vilgandiria knew little of what could truly be called “combat.” But he knew the forest better than anyone. He knew the paths taken by wild animals, the ground that would give way beneath a careless footstep, the hollows concealed by tangled vines, and which branches could bear a person's weight and which would snap with ease. To him, the forest itself was a weapon.\n　Invaders stumbled into traps he had laid. Arrows flew between the trees. He appeared and vanished, drawing his pursuers after him, only to lure them down another path—little by little, Vilgandiria led the invaders farther away from the heart of the forest.\n\n　But there were simply too many enemies.\n　For every one he brought down, two more appeared behind them, and beyond those two, he could hear yet more footsteps approaching.\n　Before long, he had exhausted both his traps and his arrows.\n　Vilgandiria discarded his bow and drew the sword at his waist with his wounded hand, but he was already struggling to catch his breath.\n　—So this is the end.\n　He was not afraid of death itself.\n　I've lived long enough already… Yet what troubled him more was the thought of these invaders advancing deeper into the forest after he had fallen. He tightened his grip on his sword once more.\n　\n　It was then that it happened.\n“Get down!”\n　A shout came in the unfamiliar tongue of humans.\n　Before Vilgandiria could even think about what the words meant, several figures rushed past him. At their head was a black-haired young man, whose sword knocked the weapon from the hands of an attacker closing in on Vilgandiria.\n“Are you all right?”\n　When Vilgandiria said nothing, the young man gave him a puzzled look.\n“…You don't understand me?”\n“No, I understand.”\n“Oh, good! We're not El-Jezas. We're on your side!”\n　Even in the midst of such danger, the young man grinned.\n“We can talk later. More are coming!”\n　The two stood back to back, raising their swords at the same moment.\n\n　This was the first time he had ever met this human. He did not even know his name, much less why he had come into the Crystal Forest… And yet, strangely enough, Vilgandiria felt no need to watch his back.\n\n　By the time the fighting was over, the first light of dawn had begun to filter through the forest.\n　The young man reached out his hand to Vilgandiria with an open, carefree smile, then pointed to himself.\n“My name is Sayvard. We were pursuing those bastards, and ended up coming all the way into this forest.”\n　He and his companions had pursued the El-Jezas, who had attacked the human lands, all the way to the outskirts of the Crystal Forest in their campaign to defeat them. By joining forces with these warriors, Vilgandiria had succeeded in driving the El-Jezas out of the forest. And this young human, who led the forces fighting against the El-Jezas, was none other than Sayvard Kahn himself—the man who, some twenty years later, would establish the first human kingdom on the continent of Susans and become its first king.\n\n　The young man then pointed at Vilgandiria.\n“What's your name?”\n“…Vilgandiria. Everyone in this forest calls me Lark.”\n“Vilgan… Lark…”\n　It seemed that the young human had trouble making out the words of the elves.\n　Vilgandiria frowned, but the young man merely laughed again. Judging by appearances, there seemed to be little difference in age between them. Yet considering the lifespan of humans, this young man was far, far younger than he was… To Vilgandiria, he should have been little more than a child. But perhaps, after spending so many years distancing himself from his companions and living alone, he had been starving for the company of others. As he spent time with Sayvard and his companions, Vilgandiria felt something within him gradually being filled.\n　He also felt an indescribable curiosity stirring within him as he encountered humans for the first time—a people whose blood might, perhaps, flow through his own veins. To him, “time” seemed almost limitless… Yet these humans lived and acted with the awareness that this precious resource was finite. Having spent his life in a world where time passed so slowly, Vilgandiria found their way of living remarkably fresh and fascinating.\n\n　Vilgandiria, who had not set foot outside the Crystal Forest for a hundred years, gradually found himself traveling alongside Sayvard.\n　At first, he had intended to stay only until the El-Jezas had been driven from the lands surrounding the Crystal Forest. But one place led to another… one battle to the next… and before he knew it, the forest he had not left in over a century lay far behind him.\n　By traveling with Sayvard, he came to know the world beyond the forest for the first time. It was a world far more exciting and full of change than the Crystal Forest, where long-lived elves dwelled and time seemed to stretch on forever. Vilgandiria felt as though the time that had stood still within him had quietly begun to move again.\n\n　＊\n\n　Sayvard, who led his fellow humans in pursuit of a peaceful world, had also come to rely on Vilgandiria's talents, vast experience, and　knowledge. The golden-haired young man he had encountered in the forest might even have been younger than himself, yet he knew so much about the continent. He knew its lands, its plants, and its animals. He knew ancient legends unfamiliar to humans, and at times served as a bridge between Sayvard's people and those who spoke languages other than their own. His skill with both sword and bow rivaled that of the finest warriors Sayvard had ever known. At first, Sayvard had struggled to understand the elven language Vilgandiria spoke, but it was not long before the young man began speaking the human tongue with ease and fluency.\n　Before long, Vilgandiria was always at Sayvard's side, sometimes fighting alongside him with sword in hand, and sometimes spending entire nights exchanging ideas about how to bring peace to the world. Vilgandiria had no desire to stand in the spotlight, nor did he have the slightest wish to leave his name in history. Yet everyone who had fought alongside Sayvard knew that Vilgandiria was the foremost hero behind the founding of Sayvard's kingdom.\n　\n　And after countless battles—most of them fought against the El-Jezas who plagued lands across the continent—Sayvard Kahn finally established the first human kingdom on the continent of Susans. Sayvard had been twenty-six when he first met Vilgandiria. Now, after twenty-two years of fighting, he was already forty-eight.\n　This was Year 0 of the Susans Continental Era, approximately a thousand years before the present day.\n\n　In the ages that followed, people would remember Sayvard Kahn as the hero who founded the kingdom, the first king. Yet no one now remembers that another hero had always stood beside him.\n　Vilgandiria.\n　And yet, the time that had stood still for him throughout his long years in the Crystal Forest had indeed begun to move again.\n\nSUSANS Continental Era — Year −22 \n\n\n\n"},{"id":"page-toc-9","text":"Section 2 — Sayvard\n\n　Year 0 of the Susans Continental Era—Sayvard Kahn, the first king of the human kingdom of Actmais, drove out the El-Jezas, followers of Suseons, the God of Time, whose influence had spread across the continent, and established the first human kingdom on the continent.\n\n　Nearly twenty years had passed since Sayvard first encountered Vilgandiria, the Ageless Man, in the Crystal Forest.\n　Most of their battles had been against the El-Jezas, but defeating them alone was not enough to build a human kingdom. There were monsters lurking throughout the land to be vanquished, disputes between different races to be mediated, and conflicts among humans themselves to be settled—there was no end to the work that needed to be done.\n　Vilgandiria had remained unchanged since the day they first met in the forest, always watching Sayvard's back and sharing wisdom far beyond anything Sayvard himself possessed. In particular, the negotiations with the king of the dragon race dwelling in the southern mountains would never have made any progress without Vilgandiria. Above all, he had never shown the slightest ambition or desire for personal gain. He had simply stood beside Sayvard, supporting him in everything he sought to accomplish.\n　Without him, I could never have achieved any of this.\n　Vilgandiria—over time, the humans had come to call him “Bilgan Durak.” The name had originated when Sayvard, shortly after their first meeting, had struggled to make out his words in the elven tongue. Vilgandiria had never bothered to correct the misunderstanding. Instead, he had gradually grown fond of the name Sayvard had given him, embracing it as his own.\n　And even after the human kingdom was established, Bilgan did not return to the Crystal Forest.\n　Though the kingdom had been founded, the El-Jezas still remained scattered throughout the land, and true peace had yet to come. Sayvard wanted Bilgan to stay in the kingdom as a trusted companion. But more than that—after twenty years together, he had come to regard Bilgan as family. He simply did not want to part with him.\n　Sayvard was already forty-eight years old, and a daughter had been born to him about three years before the founding of the kingdom. Yet throughout his busy days, it was Bilgan, rather than his own family, who had spent the most time by his side.\n\n　＊\n\n　When Sayvard was a few years past fifty, he hesitantly asked a question.\n“Bilgan… how much longer will you stay here?”\n　More than twenty-five years had passed since they first met in the Crystal Forest. Yet Bilgan looked almost exactly as he had back then. After all, even the long-lived elves had called him the “Ageless Man,” so perhaps it was only natural. Still, seeing it with his own eyes was undeniably strange.\n　By contrast, fine wrinkles had begun to form around Sayvard's eyes, and strands of gray were appearing in his hair.\n(Well, well… It seems I've somehow grown old before him…)\n　Of course, Sayvard had never known Vilgandiria's true age in the first place, so no matter how much time passed, their actual ages could never have reversed. Yet judging by appearances alone, he could hardly help feeling that way. Wondering how he must look to Bilgan now, Sayvard sighed inwardly.\n“Are you suggesting that perhaps it's time I returned to the forest?”\n　Perhaps sensing the unease behind Sayvard's unusually solemn question, his young-looking friend replied with a teasing smile.\n“It's true that we've all but wiped out the El-Jezas. But the embers of conflict still smolder throughout the land. I still need your strength, and I'd be in trouble if you left.”\n　Sayvard answered with a serious expression, giving Vilgan the very words he had hoped to hear. Vilgan smiled.\n“As long as you want me here, I intend to stay.”\n　At those words, Sayvard's expression finally brightened.\n“Then I want you to stay forever. Fortunately—”\n　Sayvard suddenly turned his head. Nearby, his young daughter lay sleeping peacefully.\n“Fortunately—my daughter has grown quite fond of you, too.”\n　Vilgandiria, too, turned his gentle silver eyes toward the sleeping child.\n　The man who had once spent his days in solitude in the Crystal Forest was no longer there.\n\n　＊\n\n　As he had promised Sayvard, Vilgandiria continued to support him even after the founding of the kingdom. At times, he led armies alongside Sayvard on campaigns to quell conflicts throughout the land.\n　As the fighting gradually subsided, his responsibilities began to shift toward raising Sayvard's daughter, Alvard Sosha, who had been named after Alvardine, the Creator Goddess. Swordsmanship, archery, horsemanship, geography, history, languages, astronomy… Vilgan taught her everything he knew.\n　And when Alvard grew old enough to wield a sword with confidence, Vilgan began taking her onto the battlefield, sometimes even entrusting her with command of the troops in his place. Having inherited her father's gift for warfare, she showed extraordinary talent from an early age, both in combat and in leading others.\n\n　A little more than ten years had passed since the founding of the kingdom, and Sayvard was approaching sixty. He had fewer opportunities to wield his sword himself, spending more and more of his time governing the kingdom. In his place, it was mainly Bilgan and the now-grown Alvard who took to the battlefield. Though still only in her mid-teens, Alvard had already distinguished herself in battle, and Sayvard sometimes saw something of his younger self in her.\n　Clad in crimson armor, her beautiful black hair flowing behind her as she fought with fearless courage, Alvard had gradually come to be revered by the soldiers as a goddess of victory. And the back that Vilgan watched over had also changed with time—no longer Sayvard's, but that of Alvard, the Crimson Warrior.\n　\n　＊\n\n　More than thirty years had passed since Sayvard first met Bilgan, and the companions who had fought alongside them in the Crystal Forest were passing away, one by one. Within the kingdom, too, there were now more and more people who had no idea how great a role Vilgan had played in its founding.\n　Some of Sayvard's retainers had even begun to regard this man, who showed no signs of aging despite the passing years and excelled in both combat and knowledge, as a potential threat. A few went so far as to advise Sayvard to distance him from the kingdom. But Sayvard refused to listen to any such counsel.\n　Bilgan himself, meanwhile, seemed to have noticed the changing attitudes around him. He had grown even more reluctant to appear in public, and within the royal palace, he increasingly took care to conduct himself discreetly and avoid drawing attention.\n\n　One day, Sayvard summoned Bilgan to his private chambers, taking care to avoid the attention of others. As they faced each other alone for the first time in quite a while, Sayvard felt that the brightness he had once known in his friend's expression had faded.\n(Perhaps life here has become too confining for him… If things continue like this, he may eventually leave my side.)\n　Sayvard searched for the right words for a while before speaking quietly.\n“This continent is vast. There's a limit to how much I can protect on my own, ruling it all as a single kingdom. So I've been thinking—what if we eventually divided it into several kingdoms, each governed by its own king?”\n　He continued, watching Bilgan's expression for any sign of a reaction.\n“And I'd like you to rule one of those kingdoms.”\n　Bilgan did not answer the unexpected proposal immediately.\n“I have no desire for such a thing… I thought you, of all people, would understand that.”\n　At last, Bilgan looked Sayvard straight in the face. Sayvard felt as though his friend's gaze had settled on the deep wrinkles etched into his face and the hair that had turned more than half gray. When they had first met, they had been almost the same height, but now Sayvard stood slightly shorter than his friend.\n\"You've grown old… Sayvard.\"\n\"More than thirty years have passed since then… It can't be helped. For a human like me, thirty years is a very long time.\"\n　Sayvard turned his face away, as though trying to escape Bilgan's gaze.\n\"I have to start making decisions with the end of my own life in mind. You're the only one I can trust to carry on after I'm gone.\"\n　Bilgan remained silent.\n\"The children are still far too inexperienced. You're the only one who—\"\n\"I think dividing the kingdom is a good idea.\"\n　Bilgan interrupted him.\n\"You should become the king of kings, ruling over the other kingdoms from here. But—I cannot be the king of a human kingdom.\"\n　After a brief pause, he continued.\n\"Besides, I've taught Al… Alvard everything I know. In time, I'm certain she'll become someone worthy of bearing the responsibility for this kingdom.\"\n\"Then will you stand by Alvard in my place?\"\n　Sayvard looked at Bilgan with pleading eyes. The voice that had once rung out across battlefields was now slightly hoarse.\n\"Alvard…?\"\n　Sayvard nodded.\n\"Ever since my daughter was born, you've always been there for her… If you stay by her side, I'm sure she'll one day become a queen worthy of leading this kingdom… And I… someday…\"\n　For just an instant, Sayvard thought he saw Bilgan's expression twist with pain as his friend looked at him.\n　Bilgan said nothing more.\n　And without another word, he left the room.\n\n　And the fear that had haunted Sayvard finally became reality.\n　Not long afterward, Bilgan Durak vanished from Sayvard's kingdom. Without a word, without leaving anything behind.\n　Year 17 of the SUSANS Continental Era—seventeen years after Sayvard founded his kingdom. Sayvard was sixty-five years old, and Alvard had turned twenty.\n\n　＊\n \n　Before the aging Emperor Sayvard appeared a man and a woman, both enveloped in radiant light.\n　Sayvard knew them. He had met them once before, in his younger days—long before he had encountered Vilgandiria in the Crystal Forest.\n　For several years now, reports from across the land had told Sayvard that the followers of El-Jezas were once again growing in strength.\n\"Suseons has found a vessel through which he can take physical form in this world. If he descends into this world, you who dwell in the Material Plane—the realm governed by time—will stand no chance against him.\"\n　It was the young woman who spoke first. The light surrounding her obscured her face, but Sayvard remembered her voice.\n　Altemisha Lua—the goddess of light and destiny.\n\"Using a man you know well, Bilgan Durak, as his vessel…\"\n　This time, it was the man who spoke. Sayvard recognized his voice as well. Apollon Dice—a god of light and destiny, just like Altemisha.\n　Bilgan Durak.\n　The moment he heard that name, Sayvard felt his consciousness begin to slip away from sheer shock.\n　For decades—through nearly his entire life—he had fought alongside that trusted friend against the followers of El-Jezas. Why, after all this time, would Bilgan be involved with the very enemy they had fought together? And what could it possibly mean that he was to become Suseons's vessel?\n　He could make no sense of any of it.\n\"To stop him now that he has taken Suseons's will into his body and seeks to wield the power of time, you have grown somewhat too old. We shall borrow the body of your child and use our divine power to seal Suseons away.\"\n\"My child…?\"\n　Even as he repeated the question, Sayvard knew whom they meant by his \"child.\" And yet—he could not accept it.\n　Apollon Dice nodded slowly.\n\"Your daughter, who bears the name of Alvardine, the Mother of All.\"\n　The aging Emperor Sayvard's face darkened with anguish.\n\"That burden is far too cruel for her… She holds Bilgan Durak dear. As a father, as a teacher… and as a man.\"\n　The thought of those two—the beloved friend who had supported him through most of his life, and the daughter who loved that friend—being forced to fight each other to the death was almost more than Sayvard could bear.\n　\n　The goddess spoke gently to the troubled Sayvard.\n\"She will be all right. She will fulfill her destiny.\"\n\"Now, give your daughter Sar Alvardi, the divine sword bestowed upon you by Alvardine long ago to drive back the followers of El-Jezas. A body imbued with the power of a god can only be cut by a divine blade.\"\n　Apollon Dice turned his gaze toward the throne.\n　Behind it, a sword hung on display, still resting in its sheath. That sword had accompanied Sayvard across countless battlefields, yet it had not been drawn for many years.\n　At that moment, the sword drew itself from its sheath.\n　Sayvard's eyes widened. The blade of the divine sword Sar Alvardi was glowing with a pale blue light. Even Sayvard, who had wielded the sword for so many years, had never seen it shine like this before.\n　Apollon Dice made a slight beckoning gesture with his hand.\n　The divine sword, glowing pale blue, flew through the air and spun toward Sayvard before plunging deep into the floor, as though separating the two gods from the aging king.\n\n　\"The blood pact you once made with Alvardine will be passed down to your daughter as well. Entrust her with that sword, and seal Suseons away. Before he fully descends into this world.\"\n\n　Sayvard gazed at Sar Alvardi, embedded in the floor before him. The sword that the gods had entrusted to him in his youth must now be passed on to his daughter.\n　The pale blue light quietly illuminated the aging Sayvard's face.\n\n\nSUSANS Continental Era Year 17\n\n\n\n\n"},{"id":"page-toc-10","text":"第三節　アルヴァード\n \n　大陸暦１７年。\n　アルヴァードは、自室に閉じこもったまま、もう何日も姿を見せていなかった。\nある日、ビルガン・デュラクが突然、彼女の前から姿を消してしまったのだ。\n　ビルガンは、アルヴァードが生まれたときから、ずっとそばにいた。幼い頃に母を亡くし、英雄王として多忙な父とも過ごす時間が限られていた彼女にとって、ビルガンは誰よりも身近な存在であり、自分を育て、導いてくれた師でもあった。\n\n"}],"currentPageIndex":7,"fontSize":17,"fontChoice":"gothic"},"toc":{"entries":[{"id":1,"level":"part","title":"Part I — The Ancient Age","pageId":"page-root","localStart":0,"localEnd":24,"start":0,"end":24,"anchorText":"Part I — The Ancient Age","headingSize":1.6,"headingFont":"inherit","headingBold":true,"pageBreak":false},{"id":2,"level":"chapter","title":"Chapter 1 — The Age of Gods","pageId":"page-toc-2","localStart":0,"localEnd":27,"start":26,"end":53,"anchorText":"Chapter 1 — The Age of Gods","headingSize":1.4,"headingFont":"inherit","headingBold":true,"pageBreak":true},{"id":3,"level":"section","title":"Section 1 — Prologue","pageId":"page-toc-2","localStart":29,"localEnd":49,"start":55,"end":75,"anchorText":"Section 1 — Prologue","headingSize":1.2,"headingFont":"inherit","headingBold":true,"pageBreak":false},{"id":4,"level":"section","title":"Section 2 — Alvardine","pageId":"page-toc-4","localStart":0,"localEnd":21,"start":1916,"end":1937,"anchorText":"Section 2 — Alvardine","headingSize":1.2,"headingFont":"inherit","headingBold":true,"pageBreak":true},{"id":5,"level":"section","title":"Section 3 — Suseons","pageId":"page-toc-5","localStart":0,"localEnd":19,"start":5526,"end":5545,"anchorText":"Section 3 — Suseons","headingSize":1.2,"headingFont":"inherit","headingBold":true,"pageBreak":true},{"id":7,"level":"chapter","title":"Chapter 2 — The Age
