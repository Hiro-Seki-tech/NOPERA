AIRIKU.jpg","fileName":"1-1-3_SUSANS_TAIRIKU.jpg","type":"image/jpeg","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1-1-3_SUSANS_TAIRIKU.jpg"},{"id":4,"anchorMode":"unique-text","pageId":"page-toc-7","localStart":61,"localEnd":73,"localInsertAt":73,"start":11912,"end":11924,"insertAt":11924,"anchorText":"Vilgandiria:","name":"1-2-1_vuilguan.jpg","fileName":"1-2-1_vuilguan.jpg","type":"image/jpeg","align":"right","size":50,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-1_vuilguan.jpg"},{"id":5,"anchorMode":"unique-text","pageId":"page-toc-7","localStart":429,"localEnd":449,"localInsertAt":449,"start":12280,"end":12300,"insertAt":12300,"anchorText":"unite the continent.","name":"1-2-1_seivard.jpg","fileName":"1-2-1_seivard.jpg","type":"image/jpeg","align":"center","size":80,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-1_seivard.jpg"},{"id":6,"anchorMode":"unique-text","pageId":"page-toc-7","localStart":452,"localEnd":466,"localInsertAt":466,"start":12303,"end":12317,"insertAt":12317,"anchorText":"Alvard Sosha: ","name":"1-2-1_alvard.jpg","fileName":"1-2-1_alvard.jpg","type":"image/jpeg","align":"left","size":50,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-1_alvard.jpg"},{"id":7,"anchorMode":"unique-text","pageId":"page-toc-8","localStart":876,"localEnd":891,"localInsertAt":891,"start":13276,"end":13291,"insertAt":13291,"anchorText":" everyday life.","name":"1-2-1_crystal_wood.jpg","fileName":"1-2-1_crystal_wood.jpg","type":"image/jpeg","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-1_crystal_wood.jpg"},{"id":8,"anchorMode":"unique-text","pageId":"page-toc-8","localStart":7764,"localEnd":7778,"localInsertAt":7778,"start":20164,"end":20178,"insertAt":20178,"anchorText":"watch his back","name":"1_2_seivard_vuilguan.jpg","fileName":"1_2_seivard_vuilguan.jpg","type":"image/jpeg","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1_2_seivard_vuilguan.jpg"},{"id":9,"anchorMode":"unique-text","pageId":"page-toc-8","localStart":12564,"localEnd":12578,"localInsertAt":12578,"start":24964,"end":24978,"insertAt":24978,"anchorText":"Era — Year −22","name":"1-2-1_SCE_vilgan.png","fileName":"1-2-1_SCE_vilgan.png","type":"image/png","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-1_SCE_vilgan.png"},{"id":10,"anchorMode":"unique-text","pageId":"page-toc-9","localStart":5786,"localEnd":5802,"localInsertAt":5802,"start":30769,"end":30785,"insertAt":30785,"anchorText":"Crimson Warrior.","name":"1-2-2_alvard_vuilguan.jpg","fileName":"1-2-2_alvard_vuilguan.jpg","type":"image/jpeg","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-2_alvard_vuilguan.jpg"},{"id":11,"anchorMode":"unique-text","pageId":"page-toc-9","localStart":12916,"localEnd":12937,"localInsertAt":12937,"start":37899,"end":37920,"insertAt":37920,"anchorText":" from the aging king.","name":"1-2-2_seivard_salvado.jpg","fileName":"1-2-2_seivard_salvado.jpg","type":"image/jpeg","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-2_seivard_salvado.jpg"},{"id":12,"anchorMode":"unique-text","pageId":"page-toc-9","localStart":13365,"localEnd":13388,"localInsertAt":13388,"start":38348,"end":38371,"insertAt":38371,"anchorText":"Continental Era Year 17","name":"1-2-2_SCE17.jpg","fileName":"1-2-2_SCE17.jpg","type":"image/jpeg","align":"center","size":100,"folder":"../image","anchorLost":false,"assetPath":"../image/1-2-2_SCE17.jpg"}],"nextId":13,"folder":"../image"},"music":{"entries":[{"id":1,"illustrationId":1,"action":"play","name":"1-1-2_Alvardine_Salvado","fileName":"1-1-2_Alvardine_Salvado.mp3","type":"audio/mpeg","playMode":"once","folder":"","assetPath":"../music/1-1-2_Alvardine_Salvado.mp3"},{"id":2,"illustrationId":3,"action":"fadeout","name":"5秒フェードアウト","fileName":"","type":"","playMode":"once","folder":"../music"},{"id":3,"illustrationId":7,"action":"play","name":"1_2_1_Crystall Wood","fileName":"1_2_1_Crystall Wood.mp3","type":"audio/mpeg","playMode":"once","folder":"../music","assetPath":"../music/1_2_1_Crystall%20Wood.mp3"},{"id":4,"illustrationId":9,"action":"fadeout","name":"5秒フェードアウト","fileName":"","type":"","playMode":"once","folder":"../music"},{"id":5,"illustrationId":11,"action":"play","name":"1-2_seivard_salvado","fileName":"1-2_seivard_salvado.mp3","type":"audio/mpeg","playMode":"once","folder":"../music","assetPath":"../music/1-2_seivard_salvado.mp3"}],"nextId":6,"folder":"../music"},"cover":{"title":"SUSANS","titleFont":"mincho","titleSize":"44","subtitle":"The Genesis of Susans","credits":[{"label":"著者","value":"閃文太郎"}],"mode":"opera","book":{"coverColor":"#173f35","textColor":"#f3d889","decoration":true,"frameStyle":"double"},"opera":{"curtainColor":"#1c7346","textColor":"#f8e7b0","decoration":true,"style":"grand"}}}</script>
<script>
(() => {
  "use strict";

  const FONT_FAMILIES = {
    gothic: '"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif',
    mincho: '"Yu Mincho","Hiragino Mincho ProN",serif',
    serif: 'Georgia,"Times New Roman","Yu Mincho",serif'
  };
  const COVER_FONT_FAMILIES = {
    gothic: '"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif',
    mincho: '"Yu Mincho","Hiragino Mincho ProN",serif',
    serif: 'Georgia,"Times New Roman","Yu Mincho",serif'
  };
  let noperaStartTimer = null;

  let project = null;
  let pages = [];
  let tocEntries = [];
  let illustrations = [];
  let musicEntries = [];
  let currentPage = 0;
  let soundOn = false;
  let currentAudio = null;
  let currentAudioEntryId = null;
  let fadeToken = 0;
  let triggeredOnPage = new Set();
  let scrollTicking = false;

  const READER_SETTINGS_KEY = "NOPERA_READER_TEXT_SETTINGS_V1";
  const BOOKMARK_STORAGE_PREFIX = "NOPERA_READER_BOOKMARK_V1:";
  let currentWorkKey = null;
  let currentBookmark = null;
  let authorTextSettings = { fontChoice:"mincho", fontSize:18, fontWeight:"normal" };
  let readerTextSettings = null;

  const $ = id => document.getElementById(id);
  const reading = $("reading"), title = $("storyTitle"), subtitle = $("storySubtitle");
  const breadcrumb = $("breadcrumb"), pageCount = $("pageCount");
  const prev = $("prevButton"), next = $("nextButton"), soundButton = $("soundButton");
  const headerPrev = $("headerPrevButton");
  const testPrev = $("testPrevButton"), testNext = $("testNextButton"), testPageCount = $("testPageCount");
  const tocBackdrop = $("tocBackdrop"), tocList = $("tocList");
  const textBackdrop = $("textBackdrop");
  const bookmarkBackdrop = $("bookmarkBackdrop");

  function toast(message) {
    const el = $("toast"); el.textContent = message; el.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function validate(data) {
    return !!(data && data.format === "NOPERA_TEMP_PROJECT" &&
      [1,2,3].includes(Number(data.formatVersion)) &&
      data.manuscript && typeof data.manuscript.fullText === "string" &&
      data.toc && Array.isArray(data.toc.entries) &&
      data.illustrations && Array.isArray(data.illustrations.entries));
  }

  function normalizeProject(data) {
    const fullText = data.manuscript.fullText || "";
    let p = Array.isArray(data.manuscript.pages) ? data.manuscript.pages
      .map(x => ({id:String(x.id || ""), text:String(x.text || "")})).filter(x => x.id) : [];
    if (!p.length) p = [{id:"page-1", text:fullText}];

    let cursor = 0;
    p = p.map(x => {
      const start = cursor; cursor += x.text.length;
      return {...x, start, end:cursor};
    });

    const t = data.toc.entries.map(x => ({...x}));
    const ill = data.illustrations.entries.map(x => ({...x}));
    const music = data.music && Array.isArray(data.music.entries) ? data.music.entries.map(x => ({
      ...x, action:x.action === "fadeout" ? "fadeout" : "play"
    })) : [];

    // v3 page-local positions are authoritative when present.
    const starts = new Map(p.map(x => [x.id, x.start]));
    t.forEach(x => {
      if (x.pageId && starts.has(x.pageId)) {
        x.start = starts.get(x.pageId) + Math.max(0, Number(x.localStart) || 0);
        x.end = starts.get(x.pageId) + Math.max(Number(x.localStart)||0, Number(x.localEnd)||0);
      }
    });
    ill.forEach(x => {
      if (x.pageId && starts.has(x.pageId)) {
        x.start = starts.get(x.pageId) + Math.max(0, Number(x.localStart) || 0);
        x.end = starts.get(x.pageId) + Math.max(Number(x.localStart)||0, Number(x.localEnd)||0);
        x.insertAt = starts.get(x.pageId) + Math.max(0, Number(x.localInsertAt) || 0);
      }
    });
    return {pages:p,toc:t,illustrations:ill,music};
  }

  function coverSettings() {
    const c = project && project.cover ? project.cover : {};
    return c;
  }

  // Step25：Generator/JSON形式を変更せず、Reader側だけで作品を識別する。
  // 表紙情報と本文全体から軽量なハッシュを作り、作品ごとに1個のしおりを保存する。
  function makeWorkKey(data) {
    const c = data && data.cover ? data.cover : {};
    const m = data && data.manuscript ? data.manuscript : {};
    const source = [
      String(c.title || c.workTitle || ""),
      String(c.subtitle || ""),
      String(m.fullText || "")
    ].join("\u241f");
    let hash = 2166136261;
    for (let i = 0; i < source.length; i++) {
      hash ^= source.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0).toString(16).padStart(8,"0");
  }

  function loadBookmark() {
    currentBookmark = null;
    if (!currentWorkKey) return null;
    try {
      const raw = localStorage.getItem(BOOKMARK_STORAGE_PREFIX + currentWorkKey);
      if (!raw) return null;
      const data = JSON.parse(raw);
      const pageIndex = Number(data.pageIndex);
      if (!Number.isInteger(pageIndex) || pageIndex < 0 || pageIndex >= pages.length) return null;
      currentBookmark = { pageIndex };
      return currentBookmark;
    } catch (e) {
      console.warn("しおりを読み込めませんでした", e);
      return null;
    }
  }

  function updateBookmarkUi() {
    const button = $("bookmarkButton");
    button.disabled = !project || !pages.length;

    const resume = $("noperaBookmarkResume");
    if (resume) {
      resume.hidden = !currentBookmark;
      if (currentBookmark) resume.textContent = `しおりから読む（${currentBookmark.pageIndex + 1}ページ）`;
    }

    const status = $("bookmarkStatus");
    const jump = $("bookmarkJump");
    const remove = $("bookmarkRemove");
    if (status) {
      status.textContent = currentBookmark
        ? `${currentBookmark.pageIndex + 1}ページにしおりがあります。`
        : "しおりはまだありません。";
    }
    if (jump) jump.disabled = !currentBookmark;
    if (remove) remove.disabled = !currentBookmark;
  }

  function saveBookmark() {
    if (!project || !pages.length || !currentWorkKey) return;
    const data = { pageIndex: currentPage, savedAt: new Date().toISOString() };
    try {
      localStorage.setItem(BOOKMARK_STORAGE_PREFIX + currentWorkKey, JSON.stringify(data));
      currentBookmark = { pageIndex: currentPage };
      updateBookmarkUi();
      toast(`${currentPage + 1}ページにしおりを挟みました`);
    } catch (e) {
      console.warn("しおりを保存できませんでした", e);
      toast("しおりを保存できませんでした");
    }
  }

  function removeBookmark() {
    if (!project || !currentWorkKey || !currentBookmark) return;
    try {
      localStorage.removeItem(BOOKMARK_STORAGE_PREFIX + currentWorkKey);
      currentBookmark = null;
      updateBookmarkUi();
      toast("しおりを外しました");
    } catch (e) {
      console.warn("しおりを外せませんでした", e);
      toast("しおりを外せませんでした");
    }
  }

  function jumpToBookmark() {
    if (!project || !currentBookmark) return;
    currentPage = currentBookmark.pageIndex;
    renderPage(true);
    toast(`${currentPage + 1}ページのしおりへ移動しました`);
  }

  function loadReaderTextSettings() {
    try {
      const raw = localStorage.getItem(READER_SETTINGS_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return {
        fontChoice: FONT_FAMILIES[s.fontChoice] ? s.fontChoice : null,
        fontSize: Number.isFinite(Number(s.fontSize)) ? Math.min(32, Math.max(14, Number(s.fontSize))) : null,
        fontWeight: ["normal","600"].includes(String(s.fontWeight)) ? String(s.fontWeight) : null
      };
    } catch (e) {
      console.warn("文字設定を読み込めませんでした", e);
      return null;
    }
  }

  function saveReaderTextSettings() {
    try {
      if (readerTextSettings) localStorage.setItem(READER_SETTINGS_KEY, JSON.stringify(readerTextSettings));
      else localStorage.removeItem(READER_SETTINGS_KEY);
    } catch (e) {
      console.warn("文字設定を保存できませんでした", e);
    }
  }

  function effectiveTextSettings() {
    const r = readerTextSettings || {};
    return {
      fontChoice: r.fontChoice || authorTextSettings.fontChoice,
      fontSize: Number(r.fontSize) || authorTextSettings.fontSize,
      fontWeight: r.fontWeight || authorTextSettings.fontWeight
    };
  }

  function applyTextSettings() {
    const s = effectiveTextSettings();
    reading.style.fontFamily = FONT_FAMILIES[s.fontChoice] || FONT_FAMILIES.mincho;
    reading.style.fontSize = s.fontSize + "px";
    reading.style.fontWeight = s.fontWeight;
    $("fontSizeValue").textContent = s.fontSize + "px";

    document.querySelectorAll("[data-reader-font]").forEach(btn => {
      btn.classList.toggle("is-selected", btn.dataset.readerFont === s.fontChoice);
    });
    document.querySelectorAll("[data-reader-weight]").forEach(btn => {
      btn.classList.toggle("is-selected", btn.dataset.readerWeight === s.fontWeight);
    });
  }

  function setReaderSetting(key, value) {
    const base = effectiveTextSettings();
    readerTextSettings = {
      fontChoice: base.fontChoice,
      fontSize: base.fontSize,
      fontWeight: base.fontWeight,
      [key]: value
    };
    saveReaderTextSettings();
    applyTextSettings();
  }


  function fillCoverCredits(target, credits) {
    target.replaceChildren();
    (Array.isArray(credits) ? credits : []).forEach(item => {
      const label = typeof item?.label === "string" ? item.label.trim() : "";
      const value = typeof item?.value === "string" ? item.value.trim() : "";
      if (!label && !value) return;
      const line = document.createElement("div");
      line.textContent = label && value ? `${label}：${value}` : (label || value);
      target.appendChild(line);
    });
  }

  function normalizedCover() {
    const c = coverSettings();
    return {
      title: typeof c.title === "string" && c.title.trim() ? c.title.trim() : "タイトル",
      titleFont: COVER_FONT_FAMILIES[c.titleFont] ? c.titleFont : "mincho",
      titleSize: Math.max(18, Math.min(72, Number(c.titleSize) || 44)),
      subtitle: typeof c.subtitle === "string" ? c.subtitle.trim() : "",
      credits: Array.isArray(c.credits) ? c.credits : [],
      mode: c.mode === "opera" ? "opera" : "book",
      book: {
        coverColor: c.book && typeof c.book.coverColor === "string" ? c.book.coverColor : "#173f35",
        textColor: c.book && typeof c.book.textColor === "string" ? c.book.textColor : "#f3d889",
        decoration: !(c.book && c.book.decoration === false),
        frameStyle: c.book && ["single","double","classic","arched","geometric","japanese"].includes(c.book.frameStyle) ? c.book.frameStyle : "double"
      },
      opera: {
        curtainColor: c.opera && typeof c.opera.curtainColor === "string" ? c.opera.curtainColor : "#741c28",
        textColor: c.opera && typeof c.opera.textColor === "string" ? c.opera.textColor : "#f8e7b0",
        decoration: !(c.opera && c.opera.decoration === false),
        style: c.opera && ["classic","grand","soft","dark","modern"].includes(c.opera.style) ? c.opera.style : "classic"
      }
    };
  }

  function clearCoverClasses(el) {
    ["single","double","classic","arched","geometric","japanese"].forEach(x => el.classList.remove("book-frame-"+x));
    ["classic","grand","soft","dark","modern"].forEach(x => el.classList.remove("opera-style-"+x));
  }

  function showProjectCover() {
    const c = normalizedCover();
    const gate = $("noperaCoverGate"), stage = $("noperaCoverStage");
    clearCoverClasses(stage);
    stage.classList.toggle("is-book", c.mode === "book");
    stage.classList.toggle("is-opera", c.mode === "opera");
    $("noperaCoverTitle").textContent = c.title;
    $("noperaCoverSubtitle").textContent = c.subtitle;
    $("noperaCoverSubtitle").hidden = !c.subtitle;
    $("noperaCoverTitle").style.fontFamily = COVER_FONT_FAMILIES[c.titleFont];
    $("noperaCoverTitle").style.fontSize = c.titleSize + "px";
    fillCoverCredits($("noperaCoverCredits"), c.credits);

    const color = c.mode === "book" ? c.book.textColor : c.opera.textColor;
    stage.style.color = color;
    $("noperaCoverTitle").style.color = color;
    $("noperaCoverSubtitle").style.color = color;
    $("noperaCoverCredits").style.color = color;

    if (c.mode === "book") {
      stage.style.setProperty("--nopera-book-cover-color", c.book.coverColor);
      stage.style.background = c.book.coverColor;
      stage.classList.add("book-frame-" + c.book.frameStyle);
      stage.querySelector(".nopera-book-frame-layer").hidden = !c.book.decoration;
    } else {
      stage.style.background = "";
      stage.style.setProperty("--nopera-start-curtain", c.opera.curtainColor);
      stage.classList.add("opera-style-" + c.opera.style);
      stage.querySelector(".nopera-book-frame-layer").hidden = true;
      stage.querySelectorAll(".nopera-cover-curtain").forEach(el => {
        el.style.borderBottomColor = c.opera.decoration ? "#d6b85f" : "transparent";
      });
    }

    gate.hidden = false;
    gate.setAttribute("aria-hidden","false");
    $("noperaCoverStart").focus({preventScroll:true});
  }

  function closeStartExperience() {
    if (noperaStartTimer) { clearTimeout(noperaStartTimer); noperaStartTimer = null; }
    const exp = $("noperaStartExperience");
    exp.hidden = true; exp.setAttribute("aria-hidden","true"); exp.classList.remove("is-finishing");
    $("noperaStartBook").classList.remove("is-opening");
    $("noperaStartOpera").classList.remove("is-opening");
    $("noperaStartBook").hidden = true; $("noperaStartOpera").hidden = true;
  }

  function finishStartExperience(delay) {
    noperaStartTimer = setTimeout(() => {
      $("noperaStartExperience").classList.add("is-finishing");
      noperaStartTimer = setTimeout(() => {
        closeStartExperience();
        window.scrollTo({top:0,left:0,behavior:"auto"});
        requestAnimationFrame(checkMusicTriggers);
      }, 520);
    }, delay);
  }

  function startProjectExperience() {
    if (!project) return;
    closeStartExperience();

    // Step24-1：表紙は「最初から読む」入口。
    // Generatorの currentPageIndex は編集再開情報として保持し、
    // Readerの開始ページには使わない。
    currentPage = 0;
    renderPage(false);
    window.scrollTo({top:0,left:0,behavior:"auto"});

    const c = normalizedCover();
    const gate = $("noperaCoverGate");
    gate.hidden = true; gate.setAttribute("aria-hidden","true");

    // Generatorと同じ仕様：［物語をはじめる］というユーザー操作でSOUND ON。
    soundOn = true;
    updateSoundButton();

    const exp = $("noperaStartExperience");
    exp.hidden = false; exp.setAttribute("aria-hidden","false");

    if (c.mode === "opera") {
      const scene = $("noperaStartOpera");
      scene.hidden = false;
      $("noperaStartOperaTitle").textContent = c.title;
      $("noperaStartOperaSubtitle").textContent = c.subtitle;
      $("noperaStartOperaSubtitle").hidden = !c.subtitle;
      $("noperaStartOperaTitle").style.fontFamily = COVER_FONT_FAMILIES[c.titleFont];
      $("noperaStartOperaTitle").style.fontSize = `clamp(18px,6vw,${Math.min(82,c.titleSize+10)}px)`;
      [$("noperaStartOperaTitle"),$("noperaStartOperaSubtitle"),$("noperaStartOperaCredits")].forEach(el => el.style.color = c.opera.textColor);
      fillCoverCredits($("noperaStartOperaCredits"), c.credits);
      scene.style.setProperty("--nopera-start-curtain", c.opera.curtainColor);
      clearCoverClasses(scene); scene.classList.add("opera-style-" + c.opera.style);
      [$("noperaStartOperaLeft"),$("noperaStartOperaRight"),$("noperaStartOperaValance")].forEach(el => {
        el.style.borderBottomColor = c.opera.decoration ? "#d6b85f" : "transparent";
      });
      requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add("is-opening")));
      finishStartExperience(1900);
    } else {
      const scene = $("noperaStartBook"), cover = $("noperaStartBookCover");
      scene.hidden = false;
      $("noperaStartBookTitle").textContent = c.title;
      $("noperaStartBookSubtitle").textContent = c.subtitle;
      $("noperaStartBookSubtitle").hidden = !c.subtitle;
      $("noperaStartBookTitle").style.fontFamily = COVER_FONT_FAMILIES[c.titleFont];
      $("noperaStartBookTitle").style.fontSize = `clamp(18px,5vw,${c.titleSize}px)`;
      [$("noperaStartBookTitle"),$("noperaStartBookSubtitle"),$("noperaStartBookCredits")].forEach(el => el.style.color = c.book.textColor);
      fillCoverCredits($("noperaStartBookCredits"), c.credits);
      cover.style.setProperty("--nopera-book-cover-color", c.book.coverColor);
      clearCoverClasses(cover); cover.classList.add("book-frame-" + c.book.frameStyle);
      cover.querySelector(".nopera-start-book-border").hidden = !c.book.decoration;
      cover.querySelector(".nopera-book-frame-layer").hidden = !c.book.decoration;
      requestAnimationFrame(() => requestAnimationFrame(() => scene.classList.add("is-opening")));
      noperaStartTimer = setTimeout(() => {
        closeStartExperience();
        window.scrollTo({top:0,left:0,behavior:"auto"});
        requestAnimationFrame(checkMusicTriggers);
      }, 2150);
    }
  }

  function applyProject(data) {
    if (!validate(data)) throw new Error("NOPERAのプロジェクトファイルではありません。");
    project = data;
    const n = normalizeProject(data);
    pages = n.pages; tocEntries = n.toc; illustrations = n.illustrations; musicEntries = n.music;
    currentWorkKey = makeWorkKey(data);
    currentPage = Math.min(Math.max(0, Number(data.manuscript.currentPageIndex)||0), pages.length-1);
    loadBookmark();
    updateBookmarkUi();

    const c = coverSettings();
    title.textContent = c.title || c.workTitle || "NOPERA";
    subtitle.textContent = c.subtitle || "";
    subtitle.hidden = !subtitle.textContent;

    const fontChoice = FONT_FAMILIES[data.manuscript.fontChoice] ? data.manuscript.fontChoice : "mincho";
    const rawFs = Number(data.manuscript.fontSize);
    const fs = Number.isFinite(rawFs) && rawFs >= 12 && rawFs <= 36 ? rawFs : 18;
    authorTextSettings = { fontChoice, fontSize:fs, fontWeight:"normal" };
    readerTextSettings = loadReaderTextSettings();
    applyTextSettings();

    buildToc();
    stopAudioImmediate();
    soundOn = false; updateSoundButton();
    renderPage(false);
    showProjectCover();
    toast("プロジェクトを読み込みました");
  }

  function pageForEntry(entry) {
    if (entry.pageId) {
      const idx = pages.findIndex(p => p.id === entry.pageId);
      if (idx >= 0) return idx;
    }
    const pos = Number(entry.start);
    if (!Number.isFinite(pos)) return 0;
    return Math.max(0, pages.findIndex((p,i) => pos >= p.start && (pos < p.end || i === pages.length-1)));
  }

  function buildToc() {
    tocList.replaceChildren();

    const coverButton = document.createElement("button");
    coverButton.type = "button";
    coverButton.className = "toc-item toc-cover-item";
    coverButton.textContent = "表紙へ";
    coverButton.addEventListener("click", () => {
      closeToc();
      showProjectCover();
    });
    tocList.appendChild(coverButton);

    const valid = tocEntries.filter(x => !x.anchorLost);
    if (!valid.length) {
      const e = document.createElement("div"); e.className="toc-empty"; e.textContent="目次は登録されていません。"; tocList.appendChild(e); return;
    }
    valid.sort((a,b) => (Number(a.start)||0)-(Number(b.start)||0)).forEach(entry => {
      const b = document.createElement("button"); b.type="button";
      const levelMap = { part:1, chapter:2, section:3 };
      const level = levelMap[entry.level] || 1;
      b.className = "toc-item level-" + level;
      b.textContent = entry.title || entry.anchorText || "目次";
      b.addEventListener("click", () => {
        currentPage = pageForEntry(entry); closeToc(); renderPage(true);
      });
      tocList.appendChild(b);
    });
  }

  function headingAt(absFrom, absTo) {
    return tocEntries.find(h => !h.anchorLost && Number(h.start) === absFrom && Number(h.end) === absTo);
  }

  function createHeadingText(textValue, entry) {
    if (!entry) return document.createTextNode(textValue);
    const span = document.createElement("span"); span.className="heading"; span.textContent=textValue;
    const size = Number(entry.headingSize)||1;
    span.style.fontSize = size + "em";
    if (entry.headingFont && entry.headingFont !== "inherit" && FONT_FAMILIES[entry.headingFont]) span.style.fontFamily = FONT_FAMILIES[entry.headingFont];
    span.style.fontWeight = entry.headingBold ? "700" : "inherit";
    return span;
  }

  function createIllustration(entry) {
    const fig = document.createElement("span"); fig.className="ill";
    fig.dataset.align = entry.align || "center"; fig.dataset.illustrationId = String(entry.id);
    const size = Math.min(100, Math.max(20, Number(entry.size)||80));
    fig.style.width = size + "%"; fig.style.maxWidth = size + "%";
    const img = document.createElement("img"); img.src = (entry.assetPath || entry.dataUrl || ""); img.alt = entry.name || "挿絵"; img.draggable=false;
    fig.appendChild(img); return fig;
  }

  function renderPage(scrollTop=true) {
    if (!pages.length) return;
    const page = pages[currentPage];
    const textValue = page.text;
    reading.replaceChildren();
    triggeredOnPage = new Set();

    const pageIll = illustrations.filter(x => !x.anchorLost && Number(x.insertAt) >= page.start && Number(x.insertAt) <= page.end)
      .sort((a,b)=>(Number(a.insertAt)||0)-(Number(b.insertAt)||0));
    const pageHead = tocEntries.filter(x => !x.anchorLost && Number(x.end)>page.start && Number(x.start)<page.end)
      .sort((a,b)=>(Number(a.start)||0)-(Number(b.start)||0));

    const boundaries = new Set([0,textValue.length]);
    pageIll.forEach(x => boundaries.add(Math.max(0,Math.min(textValue.length,Number(x.insertAt)-page.start))));
    pageHead.forEach(x => {
      boundaries.add(Math.max(0,Math.min(textValue.length,Number(x.start)-page.start)));
      boundaries.add(Math.max(0,Math.min(textValue.length,Number(x.end)-page.start)));
    });
    const points=[...boundaries].sort((a,b)=>a-b);
    const illMap=new Map();
    pageIll.forEach(x => {
      const o=Math.max(0,Math.min(textValue.length,Number(x.insertAt)-page.start));
      if(!illMap.has(o)) illMap.set(o,[]); illMap.get(o).push(x);
    });

    for(let i=0;i<points.length;i++){
      const from=points[i];
      (illMap.get(from)||[]).forEach(x=>reading.appendChild(createIllustration(x)));
      if(i>=points.length-1) continue;
      const to=points[i+1]; if(to<=from) continue;
      const absFrom=page.start+from, absTo=page.start+to;
      const h=pageHead.find(x => Number(x.start)<=absFrom && Number(x.end)>=absTo);
      reading.appendChild(createHeadingText(textValue.slice(from,to),h));
    }
    const clear=document.createElement("div"); clear.className="page-clear"; reading.appendChild(clear);

    pageCount.textContent=(currentPage+1)+" / "+pages.length+" ページ";
    testPageCount.textContent=(currentPage+1)+" / "+pages.length;
    prev.disabled=currentPage===0; next.disabled=currentPage>=pages.length-1;
    headerPrev.disabled=currentPage===0;
    testPrev.disabled=currentPage===0; testNext.disabled=currentPage>=pages.length-1;
    updateBreadcrumb(page);
    if(scrollTop) window.scrollTo({top:0,left:0,behavior:"auto"});
    requestAnimationFrame(checkMusicTriggers);
  }

  function updateBreadcrumb(page) {
    const currentPageOrder = currentPage;
    const hierarchy = { part:null, chapter:null, section:null };
    const entries = tocEntries
      .filter(entry => !entry.anchorLost && entry.pageId)
      .map(entry => ({
        entry,
        pageOrder: pages.findIndex(p => p.id === entry.pageId),
        localStart: Number(entry.localStart) || 0
      }))
      .filter(item => item.pageOrder >= 0 &&
        (item.pageOrder < currentPageOrder ||
        (item.pageOrder === currentPageOrder && item.localStart <= 0)))
      .sort((a,b) => a.pageOrder - b.pageOrder ||
        a.localStart - b.localStart ||
        (Number(a.entry.id)||0) - (Number(b.entry.id)||0));

    entries.forEach(({entry}) => {
      if(entry.level === "part"){
        hierarchy.part = entry;
        hierarchy.chapter = null;
        hierarchy.section = null;
      }else if(entry.level === "chapter"){
        hierarchy.chapter = entry;
        hierarchy.section = null;
      }else if(entry.level === "section"){
        hierarchy.section = entry;
      }
    });

    const labels = [hierarchy.part, hierarchy.chapter, hierarchy.section]
      .filter(Boolean)
      .map(entry => entry.title || entry.anchorText || "");
    breadcrumb.textContent = "現在地：" + (labels.length ? labels.join(" ＞ ") : "目次未設定");
    breadcrumb.title = labels.length ? labels.join(" ＞ ") : "目次未設定";
  }

  function updateSoundButton() {
    soundButton.textContent = soundOn ? "SOUND ON" : "SOUND OFF";
    soundButton.classList.toggle("is-on",soundOn); soundButton.setAttribute("aria-pressed",String(soundOn));
  }

  function stopAudioImmediate() {
    fadeToken++;
    if(currentAudio){ currentAudio.pause(); currentAudio.currentTime=0; currentAudio.volume=1; }
    currentAudio=null; currentAudioEntryId=null;
  }

  async function fadeOut(seconds, stop=true) {
    if(!currentAudio) return;
    const audio=currentAudio, token=++fadeToken, startVolume=audio.volume, start=performance.now();
    return new Promise(resolve => {
      function frame(now){
        if(token!==fadeToken || audio!==currentAudio){ resolve(); return; }
        const p=Math.min(1,(now-start)/(seconds*1000)); audio.volume=Math.max(0,startVolume*(1-p));
        if(p<1){ requestAnimationFrame(frame); }
        else{
          if(stop){ audio.pause(); audio.currentTime=0; if(audio===currentAudio){currentAudio=null;currentAudioEntryId=null;} }
          audio.volume=1; resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function playMusic(entry) {
    if(!soundOn || !(entry.assetPath || entry.dataUrl)) return;
    if(currentAudioEntryId===entry.id && currentAudio && !currentAudio.paused) return;
    if(currentAudio) await fadeOut(3,true);
    if(!soundOn) return;
    const audio=new Audio(entry.assetPath || entry.dataUrl); audio.loop=entry.playMode==="loop"; audio.volume=1;
    currentAudio=audio; currentAudioEntryId=entry.id;
    audio.addEventListener("ended",()=>{ if(currentAudio===audio){currentAudio=null;currentAudioEntryId=null;} });
    try{ await audio.play(); }catch(e){ console.warn(e); toast("音楽を再生できませんでした"); }
  }

  function triggerForIllustration(id) {
    const entry=musicEntries.find(x=>Number(x.illustrationId)===Number(id));
    if(!entry || triggeredOnPage.has(entry.id)) return;
    triggeredOnPage.add(entry.id);
    if(entry.action==="fadeout"){ if(soundOn) fadeOut(5,true); }
    else playMusic(entry);
  }

  function checkMusicTriggers() {
    scrollTicking=false;
    if(!soundOn) return;
    const center=window.innerHeight/2;
    document.querySelectorAll(".ill[data-illustration-id]").forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.top<=center && r.bottom>=center) triggerForIllustration(el.dataset.illustrationId);
    });
  }

  window.addEventListener("scroll",()=>{
    if(!scrollTicking){scrollTicking=true;requestAnimationFrame(checkMusicTriggers);}
  },{passive:true});
  window.addEventListener("resize",()=>{
    if(!scrollTicking){scrollTicking=true;requestAnimationFrame(checkMusicTriggers);}
  });

  soundButton.addEventListener("click",()=>{
    soundOn=!soundOn; updateSoundButton();
    if(!soundOn) stopAudioImmediate();
    else { triggeredOnPage.clear(); requestAnimationFrame(checkMusicTriggers); }
  });
  function goToPage(index){
    const target=Math.max(0,Math.min(pages.length-1,index));
    if(!pages.length || target===currentPage) return;
    currentPage=target;
    renderPage(true);
  }

  prev.addEventListener("click",()=>goToPage(currentPage-1));
  headerPrev.addEventListener("click",()=>goToPage(currentPage-1));
  next.addEventListener("click",()=>goToPage(currentPage+1));
  testPrev.addEventListener("click",()=>goToPage(currentPage-1));
  testNext.addEventListener("click",()=>goToPage(currentPage+1));

  function openToc(){tocBackdrop.classList.add("open");tocBackdrop.setAttribute("aria-hidden","false");$("tocClose").focus();}
  function closeToc(){tocBackdrop.classList.remove("open");tocBackdrop.setAttribute("aria-hidden","true");$("tocButton").focus();}
  $("tocButton").addEventListener("click",openToc); $("tocClose").addEventListener("click",closeToc);
  tocBackdrop.addEventListener("click",e=>{if(e.target===tocBackdrop)closeToc();});
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    if(bookmarkBackdrop.classList.contains("open")) closeBookmarkMenu();
    else if(textBackdrop.classList.contains("open")) closeTextSettings();
    else if(tocBackdrop.classList.contains("open")) closeToc();
  });

  function openBookmarkMenu(){
    if (!project || !pages.length) return;
    updateBookmarkUi();
    bookmarkBackdrop.classList.add("open");
    bookmarkBackdrop.setAttribute("aria-hidden","false");
    $("bookmarkClose").focus();
  }
  function closeBookmarkMenu(){
    bookmarkBackdrop.classList.remove("open");
    bookmarkBackdrop.setAttribute("aria-hidden","true");
    $("bookmarkButton").focus();
  }

  $("bookmarkButton").addEventListener("click",openBookmarkMenu);
  $("bookmarkClose").addEventListener("click",closeBookmarkMenu);
  bookmarkBackdrop.addEventListener("click",e=>{if(e.target===bookmarkBackdrop)closeBookmarkMenu();});
  $("bookmarkSaveHere").addEventListener("click",()=>{
    saveBookmark();
    updateBookmarkUi();
  });
  $("bookmarkJump").addEventListener("click",()=>{
    jumpToBookmark();
    closeBookmarkMenu();
  });
  $("bookmarkRemove").addEventListener("click",()=>{
    removeBookmark();
    updateBookmarkUi();
  });

  function openTextSettings(){
    textBackdrop.classList.add("open");
    textBackdrop.setAttribute("aria-hidden","false");
    applyTextSettings();
    $("textSettingsClose").focus();
  }
  function closeTextSettings(){
    textBackdrop.classList.remove("open");
    textBackdrop.setAttribute("aria-hidden","true");
    $("textSettingsButton").focus();
  }

  $("textSettingsButton").addEventListener("click",openTextSettings);
  $("textSettingsClose").addEventListener("click",closeTextSettings);
  textBackdrop.addEventListener("click",e=>{if(e.target===textBackdrop)closeTextSettings();});

  $("fontSizeDown").addEventListener("click",()=>{
    const s=effectiveTextSettings();
    setReaderSetting("fontSize",Math.max(14,s.fontSize-2));
  });
  $("fontSizeUp").addEventListener("click",()=>{
    const s=effectiveTextSettings();
    setReaderSetting("fontSize",Math.min(32,s.fontSize+2));
  });
  document.querySelectorAll("[data-reader-font]").forEach(btn=>{
    btn.addEventListener("click",()=>setReaderSetting("fontChoice",btn.dataset.readerFont));
  });
  document.querySelectorAll("[data-reader-weight]").forEach(btn=>{
    btn.addEventListener("click",()=>setReaderSetting("fontWeight",btn.dataset.readerWeight));
  });
  $("resetAuthorTextSettings").addEventListener("click",()=>{
    readerTextSettings=null;
    saveReaderTextSettings();
    applyTextSettings();
    toast("作者設定に戻しました");
  });

  $("noperaCoverStart").addEventListener("click", startProjectExperience);
  $("noperaBookmarkResume").addEventListener("click", () => {
    if (!project || !currentBookmark) return;
    closeStartExperience();
    $("noperaCoverGate").hidden = true;
    $("noperaCoverGate").setAttribute("aria-hidden","true");
    soundOn = true;
    updateSoundButton();
    currentPage = currentBookmark.pageIndex;
    renderPage(true);
    toast(`${currentPage + 1}ページのしおりから再開しました`);
  });

  // Public output auto-loads the embedded editing metadata (no file picker needed).
  const publicProjectNode = $("nopera-public-project");
  if (publicProjectNode && publicProjectNode.textContent.trim() !== "__NOPERA_PUBLIC_PROJECT_JSON__") {
    try { applyProject(JSON.parse(publicProjectNode.textContent)); }
    catch (error) { console.error(error); toast("作品の読み込みに失敗しました"); }
  }
  $("loadButton").addEventListener("click",()=>$("projectInput").click());
  $("projectInput").addEventListener("change",e=>{
    const file=e.target.files&&e.target.files[0]; e.target.value=""; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{applyProject(JSON.parse(String(reader.result||"")));}catch(err){console.error(err);toast(err.message||"読み込みに失敗しました");}
    };
    reader.onerror=()=>toast("ファイルを読み込めませんでした");
    reader.readAsText(file);
  });
})();
</script>
</body>
</html>
